<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEO-PARIS 2077 — Portail de Campagne</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#07070f;color:#c8c8dc;font-family:'Rajdhani',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);}
.wrap{max-width:1100px;margin:0 auto;padding:50px 24px 100px;position:relative;z-index:2;display:none;}
.wrap.show{display:block;animation:wrapIn .5s ease;}
@keyframes wrapIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.hero{text-align:center;padding:30px 0 50px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:40px;}
.hero-eyebrow{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:8px;color:rgba(255,255,255,.35);margin-bottom:18px;}
.hero-title{font-family:'Orbitron',monospace;font-size:clamp(32px,6vw,58px);font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,#ff2040,#ff33cc,#00ccff,#00ff88,#ffaa00);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(255,255,255,.1);}
.hero-sub{font-size:16px;color:rgba(255,255,255,.5);margin-top:14px;letter-spacing:1px;}

.section{margin-bottom:46px;}
.section-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:4px;
  color:rgba(255,255,255,.85);margin-bottom:18px;display:flex;align-items:center;gap:12px;text-transform:uppercase;}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.card,.pickcard{display:block;text-decoration:none;border:1px solid var(--c,rgba(255,255,255,.12));border-radius:8px;
  padding:18px 18px 16px;background:rgba(255,255,255,.02);transition:all .2s;position:relative;overflow:hidden;cursor:pointer;}
.card:hover,.pickcard:hover{background:rgba(255,255,255,.05);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.card::before,.pickcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c,#888);}
.card-ico{font-size:26px;margin-bottom:10px;display:block;}
.card-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--c,#fff);margin-bottom:5px;}
.card-desc{font-size:12.5px;color:rgba(255,255,255,.45);line-height:1.5;}
.card-tag{display:inline-block;margin-top:10px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;
  padding:2px 8px;border-radius:10px;border:1px solid var(--c,#888);color:var(--c,#888);}

.note{font-size:12px;color:rgba(255,255,255,.35);line-height:1.7;margin-top:8px;}
.note code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:3px;font-family:'Share Tech Mono',monospace;color:rgba(255,255,255,.6);}

.foot{text-align:center;margin-top:60px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.25);}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:30px;}
.pickcard{text-align:center;padding:26px 16px;}
.pickcard-ico{font-size:36px;margin-bottom:12px;}
.pickcard-name{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--c);letter-spacing:2px;}
.pickcard-title{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:1px;margin-top:4px;}

.authbox-charpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;}
.authbox-charbtn{padding:8px 2px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:transparent;cursor:pointer;text-align:center;}
.authbox-charbtn .ico{font-size:16px;display:block;}
.authbox-charbtn .nm{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.5);display:block;margin-top:3px;}
.authbox-charbtn.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);}
.authbox-charbtn.on .nm{color:var(--c);}

.authbox{max-width:340px;margin:0 auto;padding:28px 26px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.02);}
.authbox-tabs{display:flex;gap:6px;margin-bottom:18px;}
.authbox-tab{flex:1;padding:9px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:transparent;color:rgba(255,255,255,.5);font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;}
.authbox-tab.on{border-color:#ffc83c;color:#ffc83c;background:rgba(255,200,60,.08);}
.authbox-lbl{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.35);margin-bottom:6px;margin-top:12px;}
.authbox-lbl:first-of-type{margin-top:0;}
.authbox input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:11px 12px;color:#fff;font-family:'Share Tech Mono',monospace;letter-spacing:1px;outline:none;}
.authbox input:focus{border-color:rgba(255,255,255,.4);}
.authbox-btn{width:100%;margin-top:18px;padding:12px;border:1px solid #ffc83c;border-radius:6px;background:rgba(255,200,60,.08);color:#ffc83c;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;cursor:pointer;}
.authbox-btn:hover{background:rgba(255,200,60,.16);}
.authbox-btn:disabled{opacity:.4;cursor:wait;}
.authbox-err{font-size:10px;color:#ff2040;letter-spacing:1px;margin-top:12px;min-height:14px;line-height:1.6;}
.authbox-msg{font-size:10px;color:#00ff88;letter-spacing:1px;margin-top:12px;min-height:14px;line-height:1.6;}

.personal-hero{text-align:center;margin-bottom:36px;}
.personal-badge{font-family:'Orbitron',monospace;font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:4px;color:var(--c);text-shadow:0 0 40px var(--c);}
.personal-sub{font-size:14px;color:rgba(255,255,255,.4);letter-spacing:2px;margin-top:8px;}
.personal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto;}
@media(max-width:520px){.personal-grid{grid-template-columns:1fr;}}
.personal-card{display:block;text-decoration:none;border:1px solid var(--c,rgba(255,255,255,.15));border-radius:10px;padding:28px 20px;text-align:center;background:rgba(255,255,255,.02);transition:all .2s;}
.personal-card:hover{background:rgba(255,255,255,.06);transform:translateY(-3px);}
.personal-card-ico{font-size:34px;margin-bottom:12px;}
.personal-card-title{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--c);}

.personal-card.locked{opacity:.4;cursor:not-allowed;pointer-events:none;filter:grayscale(.6);}
.personal-card.locked .personal-card-title{color:rgba(255,255,255,.4);}
.lock-badge{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:#ff2040;margin-top:6px;}

.lockctrl-row{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.02);margin-bottom:10px;}
.lockctrl-info{display:flex;align-items:center;gap:12px;}
.lockctrl-ico{font-size:20px;}
.lockctrl-name{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;}
.lockctrl-desc{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.lockctrl-btn{padding:8px 16px;border-radius:6px;border:1px solid;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;background:transparent;flex-shrink:0;}
.viewas-bar{position:sticky;top:0;z-index:40;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;margin:-10px -10px 14px;background:rgba(10,10,20,.95);border-bottom:2px solid var(--c);font-size:11px;letter-spacing:1px;}
.viewas-bar span{margin-right:auto;}
.viewas-bar button{font-family:inherit;font-size:10px;padding:5px 9px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:4px;cursor:pointer;}
.viewas-bar button.on{background:var(--c);color:#05050a;}
.viewas-bar button.back{position:static;border-color:#ffc83c;color:#ffc83c;}
.viewas-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:0 0 30px;}
.viewas-chips .hero-eyebrow{width:100%;text-align:center;}
.viewas-chips button{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;padding:10px 16px;border:1px solid var(--c);color:var(--c);background:transparent;border-radius:6px;cursor:pointer;}
.viewas-chips button:hover{background:rgba(255,255,255,.08);}
.plrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px solid rgba(255,255,255,.12);border-radius:8px;margin-bottom:8px;}
.pl-name{flex:1;min-width:120px;font-family:'Orbitron',monospace;font-size:12px;color:#fff;}.pl-name small{display:block;font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.plrow select{background:#0c0c18;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:6px;font-family:inherit;font-size:11px;}
.lockctrl-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.personal-card.done{border-color:#00ff88 !important;}
.done-badge{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:#00ff88;margin-top:6px;}
.lockctrl-btn.on{border-color:#ff2040;color:#ff2040;}
.lockctrl-btn.off{border-color:#00ff88;color:#00ff88;}
.lock-open-btn{padding:12px 22px;border-radius:6px;border:1px solid #ffc83c;color:#ffc83c;background:rgba(255,200,60,.08);font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;cursor:pointer;}
.lock-modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:20px;}
.lock-modal-overlay.open{display:flex;}
.lock-modal{width:520px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;background:#0c0c14;border:1px solid rgba(255,200,60,.3);border-radius:10px;overflow:hidden;}
.lock-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.1);font-family:'Orbitron',monospace;font-size:12px;letter-spacing:2px;color:#ffc83c;}
.lock-modal-close{background:transparent;border:none;color:rgba(255,255,255,.5);font-size:16px;cursor:pointer;}
.lock-modal-body{padding:16px 18px;overflow-y:auto;}
.lock-modal-cat{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.35);margin:14px 0 6px;}
.lock-modal-cat:first-child{margin-top:0;}

.switch-link{display:block;text-align:center;margin-top:34px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.3);text-decoration:none;cursor:pointer;}
.switch-link:hover{color:rgba(255,255,255,.6);}
.loading{text-align:center;padding:80px 20px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.3);}


/* ═════ HABILLAGE PORTAIL : bandeau supérieur + connexion ═════ */
#np-topbar{position:fixed;top:0;left:0;right:0;height:34px;z-index:800;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,rgba(7,7,15,.94),rgba(7,7,15,.78));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.55);}
#np-topbar::after{content:'';position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:linear-gradient(90deg,transparent,#ff33cc,#00ccff,transparent);background-size:200% 100%;animation:tbSweep 6s linear infinite;opacity:.8;}
@keyframes tbSweep{from{background-position:200% 0;}to{background-position:-200% 0;}}
#np-topbar .tb-brand{font-family:'Orbitron',monospace;font-weight:900;letter-spacing:3px;color:#ff33cc;white-space:nowrap;text-shadow:0 0 10px rgba(255,51,204,.5);}
#np-topbar .tb-tick{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
#np-topbar .tb-tick span{display:inline-block;padding-left:100%;animation:tbTick 70s linear infinite;color:rgba(0,204,255,.6);}
@keyframes tbTick{to{transform:translateX(-100%);}}
#np-topbar .tb-r{display:flex;align-items:center;gap:12px;white-space:nowrap;}
#np-topbar .tb-dot{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:tbDot 2s ease-in-out infinite;}
#np-topbar .tb-dot.off{background:#ff2040;box-shadow:0 0 8px #ff2040;}
@keyframes tbDot{50%{opacity:.35;}}
#np-topbar .tb-who{color:#ffc83c;}
@media(max-width:640px){#np-topbar .tb-tick,#np-topbar .tb-who{display:none;}#np-topbar{justify-content:space-between;}}
.wrap{padding-top:84px!important;}

.hero-ring{position:relative;width:86px;height:86px;margin:0 auto 22px;}
.hero-ring i,.hero-ring b,.hero-ring em{position:absolute;inset:0;border-radius:50%;border:1px solid transparent;}
.hero-ring i{border-top-color:#ff33cc;border-bottom-color:#00ccff;animation:ringA 6s linear infinite;box-shadow:0 0 18px rgba(255,51,204,.25);}
.hero-ring b{inset:9px;border-left-color:#00ff88;border-right-color:#ffaa00;animation:ringA 4s linear infinite reverse;}
.hero-ring em{inset:20px;border:1px dashed rgba(255,255,255,.3);animation:ringA 14s linear infinite;}
.hero-ring::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 18px #ff33cc,0 0 36px #00ccff;animation:ringPulse 2.4s ease-in-out infinite;}
@keyframes ringA{to{transform:rotate(360deg);}}
@keyframes ringPulse{50%{transform:scale(.6);opacity:.7;}}
.hero-type{display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid #00ccff;max-width:100%;animation:typeIn 2.4s steps(40,end) .4s both,caret .8s step-end infinite;}
@keyframes typeIn{from{width:0;}to{width:100%;}}
@keyframes caret{50%{border-color:transparent;}}
.hero-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.hero-chip{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.5);animation:chipIn .6s ease both;}
.hero-chip:nth-child(2){animation-delay:.15s}.hero-chip:nth-child(3){animation-delay:.3s}
.hero-chip b{color:#00ff88;font-weight:400;}
@keyframes chipIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.authbox{max-width:380px!important;padding:32px 28px!important;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01))!important;border-color:rgba(255,200,60,.22)!important;}
.authbox::before,.authbox::after{content:'';position:absolute;width:18px;height:18px;border:2px solid #ffc83c;opacity:.8;pointer-events:none;}
.authbox::before{left:8px;top:8px;border-right:none;border-bottom:none;border-radius:4px 0 0 0;}
.authbox::after{right:8px;bottom:8px;border-left:none;border-top:none;border-radius:0 0 4px 0;}
.authbox .auth-scan{position:absolute;left:0;right:0;top:-40px;height:40px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,200,60,.08),transparent);animation:authScan 5s linear infinite;}
@keyframes authScan{to{transform:translateY(520px);}}
.authbox input{transition:border-color .2s ease,box-shadow .2s ease,background .2s ease!important;}
.authbox input:focus{border-color:#ffc83c!important;box-shadow:0 0 0 3px rgba(255,200,60,.12),0 0 18px rgba(255,200,60,.15);background:rgba(255,200,60,.05)!important;}
.authbox-tab{position:relative;transition:all .25s ease!important;}
.authbox-tab.on{box-shadow:inset 0 -2px 0 #ffc83c,0 0 16px rgba(255,200,60,.12);}
.authbox-btn{position:relative;overflow:hidden;letter-spacing:3px!important;}
.authbox-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);animation:btnSheen 3.2s ease-in-out infinite;}
@keyframes btnSheen{0%,60%{left:-60%;}100%{left:130%;}}
.authbox>*:not(.auth-scan){position:relative;}


/* ═════ NAVIGATION PAR ONGLETS ═════ */
#np-tabs{position:fixed;top:34px;left:0;right:0;height:46px;z-index:790;display:none;align-items:stretch;justify-content:center;
  background:rgba(7,7,15,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);}
body.has-tabs #np-tabs{display:flex;animation:tabsIn .5s ease both;}
@keyframes tabsIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
body.has-tabs .wrap{padding-top:136px!important;}
#np-tabs .tabs-in{position:relative;display:flex;gap:2px;max-width:1100px;width:100%;overflow-x:auto;scrollbar-width:none;padding:0 12px;}
#np-tabs .tabs-in::-webkit-scrollbar{display:none;}
#np-tabs a{position:relative;display:flex;align-items:center;gap:8px;padding:0 18px;white-space:nowrap;cursor:pointer;text-decoration:none;
  font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.45);transition:color .2s ease,background .2s ease;}
#np-tabs a .ti{font-size:15px;filter:grayscale(.6);transition:filter .2s ease,transform .2s ease;}
#np-tabs a:hover{color:#fff;background:rgba(255,255,255,.04);}
#np-tabs a:hover .ti{filter:none;transform:translateY(-1px) scale(1.1);}
#np-tabs a.on{color:#ffc83c;text-shadow:0 0 12px rgba(255,200,60,.45);}
#np-tabs a.on .ti{filter:none;}
#np-tabs .tab-ind{position:absolute;bottom:0;height:2px;left:0;width:0;background:linear-gradient(90deg,#ff33cc,#ffc83c,#00ccff);box-shadow:0 0 12px rgba(255,200,60,.7);transition:left .3s cubic-bezier(.2,.8,.2,1),width .3s cubic-bezier(.2,.8,.2,1);}
@media(max-width:640px){#np-tabs{justify-content:flex-start;}#np-tabs a{padding:0 13px;font-size:10px;letter-spacing:1px;}}
.wrap .np-off{display:none!important;}
.np-pane-in{animation:paneIn .45s cubic-bezier(.2,.8,.2,1) both;}
@keyframes paneIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

.home-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:0 0 40px;}
.home-tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:24px 22px;border:1px solid var(--c);border-radius:12px;cursor:pointer;text-decoration:none;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 11%,transparent),rgba(255,255,255,.015) 60%);transition:transform .25s ease,box-shadow .25s ease;}
.home-tile::after{content:'→';position:absolute;right:20px;top:22px;font-size:18px;color:var(--c);opacity:.4;transition:transform .25s ease,opacity .25s ease;}
.home-tile:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 28px color-mix(in srgb,var(--c) 30%,transparent);}
.home-tile:hover::after{transform:translateX(6px);opacity:1;}
.home-tile .ht-ico{font-size:34px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 10px var(--c));}
.home-tile .ht-name{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--c);}
.home-tile .ht-desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.5;}
.home-tile .ht-n{margin-top:6px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.35);}
.home-about{max-width:760px;margin:0 auto 40px;padding:28px 26px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.03);line-height:1.7;color:rgba(255,255,255,.75);font-size:15px;}
.home-about p{margin:10px 0 0;}
.home-crews{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px;}

#boot{position:fixed;inset:0;z-index:9000;background:#020204;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;transition:opacity .5s ease,visibility .5s;}

@keyframes bootScan{0%{top:-3px;}100%{top:100%;}}
#boot-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,255,136,.06),transparent 60%);}

.boot-line{opacity:0;white-space:nowrap;overflow:hidden;display:flex;justify-content:space-between;gap:10px;}
.boot-line.on{animation:lineIn .25s ease forwards;}
@keyframes lineIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
.boot-line .lbl{color:rgba(0,255,136,.85);}
.boot-line .val{color:rgba(255,255,255,.4);flex-shrink:0;}

@keyframes txtGlitch{0%{transform:translate(0);text-shadow:none;}25%{transform:translate(-1px,1px);text-shadow:1px 0 #ff2040,-1px 0 #00ccff;}50%{transform:translate(1px,-1px);text-shadow:-1px 0 #ff2040,1px 0 #00ccff;}100%{transform:translate(0);text-shadow:none;}}

function connectLocks(){
  var code=getSessionCode();
  if(!code||!window.mqtt)return;
  locksTopic='spectre_locks_v1_'+code;
  try{
    locksMc=mqtt.connect(LOCK_BROKER,{clientId:'lk'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    locksMc.on('connect',function(){locksMc.subscribe(locksTopic);});
    locksMc.on('message',function(t,p){
      try{var d=JSON.parse(p.toString());if(d.type==='locks'){currentLocks=d.locks;currentHidden=d.hidden||{};currentDone=d.done||{};render();refreshLockModal();}}catch(e){}
    });
  }catch(e){}
}
function pushLocks(){
  if(locksMc&&locksMc.connected){
    locksMc.publish(locksTopic,JSON.stringify({type:'locks',locks:currentLocks,hidden:currentHidden,done:currentDone}),{retain:true});
  }
  render();
  refreshLockModal();
}
function toggleLock(key){currentLocks[key]=!currentLocks[key];pushLocks();}
function toggleHide(key){if(currentHidden[key])delete currentHidden[key];else currentHidden[key]=true;pushLocks();}
function toggleDone(key){if(currentDone[key])delete currentDone[key];else currentDone[key]=true;pushLocks();}

      html+='<div class="lockctrl-row"><div class="lockctrl-info"><span class="lockctrl-ico">'+item.ico+'</span><div><div class="lockctrl-name">'+item.name+'</div><div class="lockctrl-desc">'+item.desc+'</div></div></div>'
        +'<div class="lockctrl-btns">'
        +(item.cat==='Missions'||item.cat==='Activités'?'<button class="lockctrl-btn '+(currentDone[item.key]?'off':'')+'" style="'+(currentDone[item.key]?'':'border-color:#ffc83c;color:#ffc83c')+'" onclick="toggleDone(\''+item.key+'\')">'+(currentDone[item.key]?'✔ FAITE — ANNULER':'✔ VALIDER (FAITE)')+'</button>':'')
        +'<button class="lockctrl-btn '+(currentHidden[item.key]?'off':'')+'" style="'+(currentHidden[item.key]?'':'border-color:#bb44ff;color:#bb44ff')+'" onclick="toggleHide(\''+item.key+'\')">'+(currentHidden[item.key]?'👁 MONTRER':'🙈 CACHER')+'</button>'
        +'<button class="lockctrl-btn '+(isLocked?'off':'on')+'" onclick="toggleLock(\''+item.key+'\')">'+(isLocked?'🔓 DÉVERROUILLER':'🔒 VERROUILLER')+'</button></div></div>';
    });
  });
  var body=document.getElementById('lock-modal-body');
  if(body)body.innerHTML=html;
}
function refreshLockModal(){
  var ov=document.getElementById('lock-modal-overlay');
  if(ov&&ov.classList.contains('open'))renderLockModalBody();
}
function openLockModal(){
  renderLockModalBody();
  var ov=document.getElementById('lock-modal-overlay');
  if(ov)ov.classList.add('open');
}
function closeLockModal(){
  var ov=document.getElementById('lock-modal-overlay');
  if(ov)ov.classList.remove('open');
}

function getSessionCode(){return currentUserData?currentUserData.sessionCode:null;}

function render(){
  var wrap=document.getElementById('wrap');
  if(!currentUser){wrap.innerHTML=renderAuth();return;}
  if(!currentUserData){wrap.innerHTML='<div class="loading">CHARGEMENT...</div>';return;}
  if(!currentUserData.approved){wrap.innerHTML=renderPending();return;}
  if(isMJ()){
    if(!getSessionCode()){wrap.innerHTML=renderSessionPrompt();return;}
    if(!locksMc)connectLocks();
    if(viewAs){wrap.innerHTML=renderViewAsBar()+renderPersonal(viewAs);return;}

  }
  var role=getRole();
  if(!role){wrap.innerHTML=renderPicker();return;}
  if(!getSessionCode()){wrap.innerHTML=renderSessionPrompt();return;}
  if(!locksMc)connectLocks();
  wrap.innerHTML=renderPersonal(role);
}

/* ═════ AUTH SCREEN ═════ */
function renderAuth(){
  var html='<div class="hero"><div class="hero-ring"><i></i><b></b><em></em></div><div class="hero-eyebrow">// OPÉRATION CABARET FANTÔME //</div><div class="hero-title">NEO-PARIS 2077</div><div class="hero-sub"><span class="hero-type">Connecte-toi pour accéder à ton espace</span></div><div class="hero-chips"><span class="hero-chip">RÉSEAU NOIR · <b>EN LIGNE</b></span><span class="hero-chip">CANAL CHIFFRÉ · <b>ACTIF</b></span><span class="hero-chip">SESSION · <b>PRIVÉE</b></span></div></div>';
  html+='<div class="authbox"><div class="auth-scan"></div>';
  html+='<div class="authbox-tabs"><button class="authbox-tab '+(authMode==='login'?'on':'')+'" onclick="setAuthMode(\'login\')">SE CONNECTER</button><button class="authbox-tab '+(authMode==='signup'?'on':'')+'" onclick="setAuthMode(\'signup\')">CRÉER UN COMPTE</button></div>';
  html+='<div class="authbox-lbl">IDENTIFIANT</div><input type="text" id="auth-username" placeholder="Ex: kiki_le_nomade" autocomplete="off">';
  html+='<div class="authbox-lbl">MOT DE PASSE</div><input type="password" id="auth-password" placeholder="••••••••" onkeydown="if(event.key===\'Enter\')submitAuth();">';
  if(authMode==='signup'){
    html+='<div class="authbox-lbl">TON PERSONNAGE</div><div class="authbox-charpick">';
    Object.keys(CHARACTERS).forEach(function(k){
      var c=CHARACTERS[k];
      html+='<div class="authbox-charbtn'+(selectedSignupRole===k?' on':'')+'" data-k="'+k+'" style="--c:'+c.color+';" onclick="selSignupChar(\''+k+'\')"><span class="ico">'+c.ico+'</span><span class="nm">'+c.name+'</span></div>';
    });
    html+='</div>';
  }
  html+='<button class="authbox-btn" id="auth-submit-btn" onclick="submitAuth()">'+(authMode==='login'?'ENTRER':'CRÉER LE COMPTE')+'</button>';
  html+='<div class="authbox-err" id="auth-err"></div><div class="authbox-msg" id="auth-msg"></div>';
  html+='</div>';
  html+='<div class="foot">NEO-PARIS / 2077 — PORTAIL DE CAMPAGNE<br><a href="guide-joueur.html" target="_blank" style="color:rgba(0,255,136,.5);text-decoration:none;letter-spacing:2px;">❓ PREMIÈRE FOIS ICI ? LIS LE GUIDE DU JOUEUR</a></div>';
  return html;
}
function setAuthMode(m){authMode=m;render();}
function selSignupChar(k){
  selectedSignupRole=k;
  document.querySelectorAll('.authbox-charbtn').forEach(function(b){b.classList.remove('on');});
  var picked=document.querySelector('.authbox-charbtn[data-k="'+k+'"]');
  if(picked)picked.classList.add('on');
}
function submitAuth(){
  var u=document.getElementById('auth-username').value.trim();
  var p=document.getElementById('auth-password').value;
  var errEl=document.getElementById('auth-err'),msgEl=document.getElementById('auth-msg'),btn=document.getElementById('auth-submit-btn');
  errEl.textContent='';msgEl.textContent='';
  if(u.length<3){errEl.textContent='IDENTIFIANT TROP COURT (3 CARACTÈRES MIN)';return;}
  if(p.length<6){errEl.textContent='MOT DE PASSE TROP COURT (6 CARACTÈRES MIN)';return;}
  if(authMode==='signup'&&!selectedSignupRole){errEl.textContent='CHOISIS TON PERSONNAGE';return;}
  if(!window.firebase||!auth||!db){errEl.textContent='SERVICE INDISPONIBLE — RECHARGE LA PAGE';return;}
  btn.disabled=true;
  var fakeEmail=toFakeEmail(u);
  try{
    if(authMode==='signup'){
      var roleToSave=selectedSignupRole;
      auth.createUserWithEmailAndPassword(fakeEmail,p).then(function(cred){
        return db.collection('users').doc(cred.user.uid).set({
          username:u,role:roleToSave,sessionCode:null,approved:false,isMJ:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      }).catch(function(err){
        btn.disabled=false;
        if(err&&err.code==='auth/email-already-in-use'){errEl.textContent='CET IDENTIFIANT EXISTE DÉJÀ';}
        else if(err&&err.code==='auth/weak-password'){errEl.textContent='MOT DE PASSE TROP FAIBLE';}
        else{errEl.textContent='ERREUR : '+(err&&err.message?err.message:err);}
      });
    } else {
      auth.signInWithEmailAndPassword(fakeEmail,p).catch(function(err){
        btn.disabled=false;
        errEl.textContent='IDENTIFIANT OU MOT DE PASSE INCORRECT';
      });
    }
  }catch(syncErr){
    btn.disabled=false;
    errEl.textContent='ERREUR JS : '+(syncErr&&syncErr.message?syncErr.message:syncErr);
  }
}

var playersLoaded=false;
function loadPlayers(){
  var box=document.getElementById('mj-players');if(!box||!db)return;
  db.collection('users').get().then(function(qs){
    var rows=[];qs.forEach(function(d){var u=d.data();if(u.isMJ)return;rows.push({id:d.id,u:u});});
    rows.sort(function(a,b){return String(a.u.username).localeCompare(String(b.u.username));});
    if(!rows.length){box.innerHTML='<div class="note">Aucun joueur inscrit.</div>';return;}
    box.innerHTML=rows.map(function(r){
      var u=r.u;
      return '<div class="plrow"><div class="pl-name">'+esc(u.username)+'<small>'+(u.approved?'approuvé':'⏳ EN ATTENTE')+(u.sessionCode?' · '+esc(u.sessionCode):'')+'</small></div>'
        +'<select onchange="setPlayerRole(\''+r.id+'\',this.value)"><option value="">— aucun (choisit lui-même) —</option>'
        +Object.keys(CHARACTERS).map(function(k){return '<option value="'+k+'"'+(u.role===k?' selected':'')+'>'+CHARACTERS[k].ico+' '+CHARACTERS[k].name+'</option>';}).join('')+'</select>'
        +(u.role?'<button class="lockctrl-btn off" onclick="setViewAs(\''+u.role+'\')">👁 VOIR</button>':'')
        +(u.approved?'':'<button class="lockctrl-btn off" onclick="approvePlayer(\''+r.id+'\')">✔ APPROUVER</button>')+'</div>';
    }).join('');
  }).catch(function(err){box.innerHTML='<div class="note">Liste des joueurs indisponible : '+esc(err.message||err)+'<br>Les règles Firestore doivent autoriser le MJ à lire la collection « users ».</div>';});
}
function setPlayerRole(uid,role){
  db.collection('users').doc(uid).update({role:role||null}).then(function(){loadPlayers();}).catch(function(err){alert('Impossible de changer le rôle : '+(err.message||err));loadPlayers();});
}
function approvePlayer(uid){
  db.collection('users').doc(uid).update({approved:true}).then(function(){loadPlayers();}).catch(function(err){alert('Impossible : '+(err.message||err));});
}
function pickChar(k){
  var wrap=document.getElementById('wrap');wrap.innerHTML='<div class="loading">ENREGISTREMENT...</div>';
  db.collection('users').doc(currentUser.uid).update({role:k}).then(function(){
    currentUserData.role=k;render();
  }).catch(function(err){
    alert('Erreur : '+(err.message||err));render();
  });
}

function submitSessionCode(){

    currentUserData.sessionCode=v;render();

/* ═════ FIREBASE INIT (runs in background during boot animation) ═════ */
function identityBoot(){
  if(!window.firebase){setTimeout(identityBoot,150);return;}
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  auth.onAuthStateChanged(function(user){
    if(user){
      currentUser=user;
      db.collection('users').doc(user.uid).get().then(function(snap){
        currentUserData=snap.exists?snap.data():null;
        render();
        if(currentUserData&&!currentUserData.isMJ&&!window._selfSub){
          window._selfSub=db.collection('users').doc(user.uid).onSnapshot(function(sn){
            if(!sn.exists)return;var nd=sn.data();
            if(currentUserData&&(nd.role!==currentUserData.role||nd.approved!==currentUserData.approved)){currentUserData=nd;npTab='accueil';render();}
          },function(){});
        }
      }).catch(function(){currentUserData=null;render();});
    } else {
      currentUser=null;currentUserData=null;render();
    }
  });
}

/* ── Sauvegarde / restauration de la session ── */
var BACKUP_SKIP=['np_ident'];
var BK_LAST='',bkTimer=null,bkMc=null,bkInfo={snap:null,folder:null,server:null};
function bkCollect(){var data={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(BACKUP_SKIP.indexOf(k)<0&&k.indexOf('np_backup_')!==0)data[k]=localStorage.getItem(k);}return data;}
function bkPayload(){return JSON.stringify({app:'neo-paris-2077',version:1,date:new Date().toISOString(),data:bkCollect()});}
function bkApply(o){
  if(!o||o.app!=='neo-paris-2077'||!o.data)throw new Error('fichier non reconnu');
  var n=Object.keys(o.data).length;
  if(!confirm('Restaurer '+n+' éléments du '+(o.date||'?').replace('T',' ').slice(0,16)+' ? Les données actuelles de même nom seront remplacées.'))return false;
  Object.keys(o.data).forEach(function(k){if(BACKUP_SKIP.indexOf(k)<0)localStorage.setItem(k,o.data[k]);});
  alert('Sauvegarde restaurée. Rouvre les téléphones et outils : ils se resynchroniseront avec les joueurs.');return true;
}
function exportSession(){
  var blob=new Blob([bkPayload()],{type:'application/json'});
  var a=document.createElement('a');var d=new Date();
  a.href=URL.createObjectURL(blob);a.download='neo-paris-sauvegarde-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function importSession(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{bkApply(JSON.parse(r.result));}catch(e){alert('Restauration impossible : '+e.message);}inp.value='';};
  r.readAsText(f);
}
/* IndexedDB : instantanés + poignée du dossier */
function bkDB(){return new Promise(function(res,rej){var q=indexedDB.open('np_backup',1);q.onupgradeneeded=function(){var d=q.result;d.createObjectStore('snaps',{keyPath:'ts'});d.createObjectStore('kv');};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function bkTx(store,mode,fn){return bkDB().then(function(db){return new Promise(function(res,rej){var t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=function(){res(r&&r.result);};t.onerror=function(){rej(t.error);};});});}
function bkSnapshot(){
  var p=bkPayload(),core=JSON.stringify(bkCollect());
  if(core===BK_LAST||core==='{}')return Promise.resolve();
  BK_LAST=core;
  return bkTx('snaps','readwrite',function(s){s.put({ts:Date.now(),payload:p});}).then(function(){
    return bkTx('snaps','readwrite',function(s){return s.getAllKeys();});
  }).then(function(keys){
    var old=keys.sort(function(a,b){return b-a;}).slice(20);
    if(old.length)return bkTx('snaps','readwrite',function(s){old.forEach(function(k){s.delete(k);});});
  }).then(function(){bkInfo.snap=new Date();});
}
function bkListSnaps(){
  var sel=document.getElementById('bk-snaps');if(!sel)return;
  bkTx('snaps','readonly',function(s){return s.getAll();}).then(function(all){
    all.sort(function(a,b){return b.ts-a.ts;});
    sel.innerHTML=all.length?all.map(function(x){var d=new Date(x.ts);return '<option value="'+x.ts+'">'+d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' — '+Math.round(x.payload.length/1024)+' Ko</option>';}).join(''):'<option value="">Aucun instantané pour l\'instant</option>';
  }).catch(function(){sel.innerHTML='<option value="">Instantanés indisponibles</option>';});
}
function restoreSnapshot(){
  var sel=document.getElementById('bk-snaps');if(!sel||!sel.value)return;
  bkTx('snaps','readonly',function(s){return s.get(+sel.value);}).then(function(x){if(x)try{bkApply(JSON.parse(x.payload));}catch(e){alert('Restauration impossible : '+e.message);}});
}
/* Dossier sur l'ordinateur (File System Access API) */
function chooseBackupFolder(){
  if(!window.showDirectoryPicker){alert('Ton navigateur ne gère pas les dossiers automatiques. Utilise Chrome ou Edge sur ordinateur, ou « Exporter un fichier ».');return;}
  window.showDirectoryPicker({mode:'readwrite'}).then(function(h){return bkTx('kv','readwrite',function(s){s.put(h,'dir');}).then(function(){return bkFolderWrite(true);});}).catch(function(){});
}
function bkFolderWrite(ask){
  return bkTx('kv','readonly',function(s){return s.get('dir');}).then(function(h){
    if(!h)return;
    return h.queryPermission({mode:'readwrite'}).then(function(p){
      if(p!=='granted'){if(!ask){bkInfo.folder='permission';bkRefreshStatus();return;}return h.requestPermission({mode:'readwrite'}).then(function(p2){if(p2!=='granted')return;return bkFolderDo(h);});}
      return bkFolderDo(h);
    });
  }).catch(function(){});
}
function bkFolderDo(h){
  var d=new Date(),day=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2),p=bkPayload();
  function put(name){return h.getFileHandle(name,{create:true}).then(function(f){return f.createWritable();}).then(function(w){return w.write(p).then(function(){return w.close();});});}
  return put('neo-paris-auto.json').then(function(){return put('neo-paris-'+day+'.json');}).then(function(){bkInfo.folder=new Date();bkRefreshStatus();});
}
/* Copie sur le serveur (message retenu, si la taille reste raisonnable) */
function bkServerPush(){
  var code=getSessionCode();if(!code||!window.mqtt)return;
  var p=bkPayload();if(p.length>400000){bkInfo.server='trop gros';return;}
  function send(){bkMc.publish('spectre_backup_v1_'+code,p,{retain:true,qos:1});bkInfo.server=new Date();bkRefreshStatus();}
  if(!bkMc){bkMc=mqtt.connect(LOCK_BROKER,{clientId:'bk'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});bkMc.on('connect',send);}
  else if(bkMc.connected)send();
}
function restoreFromServer(){
  var code=getSessionCode();if(!code||!window.mqtt){alert('Code de session introuvable.');return;}
  var c=mqtt.connect(LOCK_BROKER,{clientId:'bkr'+Date.now(),clean:true,connectTimeout:8000}),got=false;
  var to=setTimeout(function(){if(!got){c.end();alert('Aucune sauvegarde trouvée sur le serveur pour ce code.');}},6000);
  c.on('connect',function(){c.subscribe('spectre_backup_v1_'+code);});
  c.on('message',function(t,m){got=true;clearTimeout(to);c.end();try{bkApply(JSON.parse(m.toString()));}catch(e){alert('Restauration impossible : '+e.message);}});
}
function bkRefreshStatus(){
  var el=document.getElementById('bk-status');if(!el)return;
  function t(d){return d instanceof Date?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):d;}
  var parts=[];
  parts.push('Instantané navigateur : '+(bkInfo.snap?t(bkInfo.snap):'en attente'));
  parts.push('Serveur : '+(bkInfo.server?t(bkInfo.server):'en attente'));
  parts.push('Dossier : '+(bkInfo.folder==='permission'?'<a href="#" onclick="bkFolderWrite(true);return false;" style="color:#ffc83c;">cliquer pour réautoriser</a>':bkInfo.folder?t(bkInfo.folder):(window.showDirectoryPicker?'non choisi':'non disponible ici')));
  el.innerHTML=parts.join(' · ');
}
function bkTick(){
  bkSnapshot().then(function(){bkListSnaps();}).catch(function(){});
  bkServerPush();bkFolderWrite(false);bkRefreshStatus();
}
function startAutoBackup(){
  if(bkTimer)return;
  bkTimer=setInterval(bkTick,120000);
  setTimeout(bkTick,4000);
}

var npTab='accueil';
function tabFromHash(){var h=(location.hash||'').replace('#','');var t=curTabs();return t&&t.some(function(x){return x.id===h;})?h:null;}
function setTab(id){
  var t=curTabs();if(!t||!t.some(function(x){return x.id===id;}))id='accueil';
  if(location.hash!=='#'+id){history.pushState(null,'','#'+id);}
  npTab=id;applyTab(true);
  if((!isMJ()||viewAs)&&arguments[1]!==false){
    var one=document.querySelectorAll('#wrap [data-pane="'+id+'"] a.personal-card[href]');
    if(id!=='accueil'&&one.length===1){try{window.open(one[0].href,'_blank');}catch(e){}}
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function applyTab(animate){
  var tabs=curTabs(),has=!!(tabs&&document.querySelector('#wrap [data-pane]'));
  document.body.classList.toggle('has-tabs',has);
  if(!has)return;
  var fromHash=tabFromHash();if(fromHash)npTab=fromHash;
  if(!tabs.some(function(x){return x.id===npTab;}))npTab='accueil';
  var inner=document.getElementById('np-tabs-in');
  var sig=tabs.map(function(x){return x.id;}).join(',');
  if(inner.getAttribute('data-sig')!==sig){
    inner.innerHTML=tabs.map(function(x){return '<a data-t="'+x.id+'" onclick="setTab(\''+x.id+'\')"><span class="ti">'+x.ico+'</span>'+x.n+'</a>';}).join('')+'<span class="tab-ind" id="tab-ind"></span>';
    inner.setAttribute('data-sig',sig);
  }
  var act=null;
  Array.prototype.forEach.call(inner.querySelectorAll('a'),function(a){var on=a.getAttribute('data-t')===npTab;a.classList.toggle('on',on);if(on)act=a;});
  var ind=document.getElementById('tab-ind');
  if(act&&ind){ind.style.left=act.offsetLeft+'px';ind.style.width=act.offsetWidth+'px';try{act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}catch(e){}}
  var shown=0;
  Array.prototype.forEach.call(document.querySelectorAll('#wrap [data-pane]'),function(el){
    var on=el.getAttribute('data-pane')===npTab;
    el.classList.toggle('np-off',!on);
    if(on&&animate){el.classList.remove('np-pane-in');void el.offsetWidth;el.style.animationDelay=Math.min(shown,10)*0.05+'s';el.classList.add('np-pane-in');}
    if(on)shown++;
  });
  /* compteurs des tuiles d'accueil */
  Array.prototype.forEach.call(document.querySelectorAll('[data-count]'),function(el){
    var id=el.getAttribute('data-count'),n=document.querySelectorAll('#wrap [data-pane="'+id+'"] .card,#wrap [data-pane="'+id+'"] .personal-card:not(.locked)').length;
    el.textContent=n?n+' ÉLÉMENT'+(n>1?'S':''):'';
  });
}
