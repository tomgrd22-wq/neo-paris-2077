*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{background:#07070d;color:#c8c8dc;font-family:'Share Tech Mono',monospace;height:100%;overflow:hidden;}

#login{position:fixed;inset:0;z-index:100;background:#07070d;display:flex;align-items:center;justify-content:center;padding:20px;}
.lw{width:460px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:30px 26px;border:1px solid rgba(255,32,64,.25);border-radius:6px;background:rgba(20,5,5,.6);}
.ltitle{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;letter-spacing:3px;color:#ff2040;text-align:center;}
.lsub{font-size:10px;letter-spacing:4px;color:rgba(255,32,64,.4);text-align:center;margin-bottom:8px;}
.llabel{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);margin-top:6px;}
#lcode{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:11px 14px;font-family:'Share Tech Mono',monospace;font-size:13px;color:#e8e8f0;outline:none;letter-spacing:2px;}
.lgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.lbtn{padding:10px 6px;border-radius:4px;border:1px solid;background:transparent;cursor:pointer;font-family:'Share Tech Mono',monospace;text-align:center;}
.lbtn b{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;display:block;}
.lbtn.on{background:rgba(255,255,255,.1);}
#lgo{border-color:#ff2040;color:#ff2040;margin-top:6px;padding:12px;}
#lerr{font-size:10px;color:#ff2040;letter-spacing:2px;min-height:14px;text-align:center;}
.rolecol-kiki{border-color:#ffaa00;color:#ffaa00;}
.rolecol-hunter{border-color:#00ccff;color:#00ccff;}
.rolecol-fury{border-color:#00ff88;color:#00ff88;}
.rolecol-keiyo{border-color:#ff33cc;color:#ff33cc;}
.rolecol-tamuro{border-color:#ff2040;color:#ff2040;}
.rolecol-mj{border-color:#e8e8f0;color:#e8e8f0;}

#app{display:none;height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(15,5,5,.9);border-bottom:1px solid rgba(255,32,64,.15);flex-wrap:wrap;gap:8px;}
.brand{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:3px;color:#ff2040;}
.cdot{width:7px;height:7px;border-radius:50%;background:#00ff88;}
.cdot.err{background:#ff2040;}

.subbar{padding:8px 18px;background:rgba(0,0,0,.3);font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.5);text-align:center;}

#map2d{position:absolute;inset:0;}
.leaflet-container{background:#0a0a10 !important;}

.mj-ctrl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:500;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 12px;}
.mc-btn{padding:10px 16px;border-radius:8px;border:1px solid;background:rgba(0,0,0,.75);font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(6px);}
.mc-reset{border-color:#ffaa00;color:#ffaa00;}
.mc-reveal{border-color:#00ff88;color:#00ff88;}

.guess-legend{position:absolute;top:70px;right:12px;z-index:500;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 12px;font-size:10px;backdrop-filter:blur(6px);max-width:150px;}
.guess-legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.guess-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.player-hint{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(0,0,0,.8);border:1px solid rgba(255,32,64,.4);border-radius:20px;padding:8px 18px;font-size:11px;letter-spacing:1px;color:#ff2040;text-align:center;max-width:90%;}
</style>
</head>
<body>

<div id="login">
  <div class="lw">
    <div class="ltitle">🚗 COURSE-POURSUITE</div>
    <div class="lsub">// NEO-PARIS 2077 //</div>
    <div class="llabel">CODE DE SESSION</div>
    <input id="lcode" type="text" placeholder="Ex : neo_paris_2077" autocomplete="off">
    <div class="llabel">RÔLE</div>
    <div class="lgrid3">
      <button class="lbtn rolecol-tamuro" data-r="tamuro" onclick="selRole('tamuro')"><b>TAMURO</b></button>
      <button class="lbtn rolecol-kiki" data-r="kiki" onclick="selRole('kiki')"><b>KIKI</b></button>
      <button class="lbtn rolecol-fury" data-r="fury" onclick="selRole('fury')"><b>FURY</b></button>
    </div>
    <div class="lgrid3">
      <button class="lbtn rolecol-hunter" data-r="hunter" onclick="selRole('hunter')"><b>MOON</b></button>
      <button class="lbtn rolecol-keiyo" data-r="keiyo" onclick="selRole('keiyo')"><b>KEIYO</b></button>
      <button class="lbtn rolecol-mj" data-r="mj" onclick="selRole('mj')"><b>MJ</b></button>
    </div>
    <button class="lbtn" id="lgo" onclick="go()">▶ ENTRER</button>
    <div id="lerr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">🚗 COURSE-POURSUITE</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;"><span id="conn-lbl">CONNEXION...</span><div class="cdot" id="conn-dot"></div></div>
  </div>
  <div class="subbar" id="subbar"></div>
  <div style="position:relative;flex:1;">
    <div id="map2d"></div>
    <div class="guess-legend" id="guess-legend" style="display:none;"></div>
    <div class="guess-legend" id="player-legend" style="display:none;top:auto;bottom:80px;"></div>
    <div class="mj-ctrl" id="mj-ctrl" style="display:none;">
      <button class="mc-btn mc-reset" onclick="resetChase()">↺ NOUVELLE COURSE</button>
      <button class="mc-btn mc-reveal" onclick="revealTruth()">🎯 RÉVÉLER LA POSITION</button>
      <button class="mc-btn" style="border-color:#ff2040;color:#ff2040;" onclick="goToVehicle()">📍 CENTRER SUR LE VÉHICULE</button>
    </div>
    <div class="player-hint" id="player-hint" style="display:none;">Clique sur la carte à l\'endroit où tu penses que le véhicule se trouve.</div>
  </div>
</div>

<script>
var BROKER='wss://broker.emqx.io:8084/mqtt';
var role=null,sCode=null,mc=null,topic='';
var ROLE_LABELS={tamuro:'TAMURO',kiki:'KIKI',fury:'FURY',hunter:'MOON',keiyo:'KEIYO'};
var ROLE_COLORS={tamuro:'#ff2040',kiki:'#ffaa00',fury:'#00ff88',hunter:'#00ccff',keiyo:'#ff33cc'};
var state={vehiclePos:null,guesses:{},revealed:false};
var mapL=null,vehicleMarker=null,vehicleTrail=[],trailLine=null,guessMarkers={},myGuessMarker=null,revealMarker=null,allyMarkers={};

var selectedRole=null;
function selRole(r){selectedRole=r;document.querySelectorAll('.lbtn[data-r]').forEach(function(b){b.classList.toggle('on',b.dataset.r===r);});}
function go(){
  var code=document.getElementById('lcode').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!code||code.length<3){document.getElementById('lerr').textContent='Code trop court';return;}
  if(!selectedRole){document.getElementById('lerr').textContent='Choisis un rôle';return;}
  role=selectedRole;sCode=code;topic='spectre_poursuite_v1_'+code;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  initMap();
  initUI();
  connectMQTT();
}

function initUI(){
  if(role==='mj'){
    document.getElementById('subbar').textContent='Clique sur la carte pour déplacer le véhicule poursuivi. Décris la route à voix haute.';
    document.getElementById('mj-ctrl').style.display='flex';
    document.getElementById('guess-legend').style.display='block';
  } else {
    document.getElementById('subbar').textContent='Écoute les indications du MJ et place ton marqueur là où tu penses que le véhicule se trouve.';
    document.getElementById('player-hint').style.display='block';
  }
}

function initMap(){
  mapL=L.map('map2d',{center:[48.8626,2.325],zoom:14,zoomControl:true,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(mapL);
  L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.6}).addTo(mapL);
  L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.85}).addTo(mapL);

  mapL.on('click',function(e){
    if(role==='mj'){
      setVehiclePos([e.latlng.lat,e.latlng.lng]);
    } else {
      if(state.revealed)return;
      setMyGuess([e.latlng.lat,e.latlng.lng]);
    }
  });
}

function setVehiclePos(pos){
  state.vehiclePos=pos;
  vehicleTrail.push(pos);
  pushState();
  renderVehicle();
}
function setMyGuess(pos){
  state.guesses[role]=pos;
  pushState();
  renderMyGuess();
}

function renderVehicle(){
  if(role!=='mj')return;
  if(!state.vehiclePos)return;
  if(vehicleMarker)mapL.removeLayer(vehicleMarker);
  vehicleMarker=L.marker(state.vehiclePos,{icon:L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:#ff2040;border:3px solid #fff;box-shadow:0 0 14px #ff2040;"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(mapL);
  if(trailLine)mapL.removeLayer(trailLine);
  if(vehicleTrail.length>1)trailLine=L.polyline(vehicleTrail,{color:'#ff2040',weight:2,opacity:0.5,dashArray:'4,6'}).addTo(mapL);
}
function renderMyGuess(){
  var pos=state.guesses[role];
  if(!pos)return;
  if(myGuessMarker)mapL.removeLayer(myGuessMarker);
  var col=ROLE_COLORS[role]||'#fff';
  myGuessMarker=L.marker(pos,{icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;border-radius:50%;background:'+col+';border:3px solid #fff;box-shadow:0 0 12px '+col+';"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(mapL);
}
function renderAllGuesses(){
  if(role!=='mj')return;
  Object.keys(guessMarkers).forEach(function(k){mapL.removeLayer(guessMarkers[k]);});
  guessMarkers={};
  var legendHtml='<b style="font-family:Orbitron;font-size:9px;letter-spacing:1px;color:#fff;">SUPPOSITIONS</b><br><br>';
  Object.keys(state.guesses).forEach(function(k){
    var pos=state.guesses[k];
    var col=ROLE_COLORS[k]||'#fff';
    guessMarkers[k]=L.marker(pos,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:'+col+';border:2px solid #fff;opacity:0.85;"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(mapL);
    legendHtml+='<div class="guess-legend-item" style="cursor:pointer;" onclick="goToGuess(\''+k+'\')"><div class="guess-dot" style="background:'+col+';"></div>'+(ROLE_LABELS[k]||k)+' 📍</div>';
  });
  if(Object.keys(state.guesses).length===0)legendHtml+='<span style="color:rgba(255,255,255,.3);">Aucune pour l\'instant</span>';
  document.getElementById('guess-legend').innerHTML=legendHtml;
}
function renderReveal(){
  if(!state.revealed||!state.vehiclePos)return;
  if(revealMarker)mapL.removeLayer(revealMarker);
  revealMarker=L.marker(state.vehiclePos,{icon:L.divIcon({className:'',html:'<div style="width:26px;height:26px;border-radius:50%;background:#ff2040;border:3px solid #fff;box-shadow:0 0 20px #ff2040;display:flex;align-items:center;justify-content:center;font-size:12px;">🚗</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(mapL);
  if(role!=='mj'){
    var hint=document.getElementById('player-hint');
    hint.innerHTML='🎯 Position réelle révélée — ta supposition est verrouillée.';
    renderPlayerLegend();
  }
}
function renderPlayerLegend(){
  var panel=document.getElementById('player-legend');
  if(!panel||role==='mj')return;
  if(!state.revealed){
    panel.style.display='none';panel.innerHTML='';
    Object.keys(allyMarkers).forEach(function(k){mapL.removeLayer(allyMarkers[k]);});
    allyMarkers={};
    return;
  }
  var html='<b style="font-family:Orbitron;font-size:9px;letter-spacing:1px;color:#fff;">SE TÉLÉPORTER</b><br><br>';
  html+='<div class="guess-legend-item" style="cursor:pointer;" onclick="goToVehicle()"><div class="guess-dot" style="background:#ff2040;"></div>🚗 VÉHICULE (réel) 📍</div>';
  Object.keys(allyMarkers).forEach(function(k){mapL.removeLayer(allyMarkers[k]);});
  allyMarkers={};
  Object.keys(state.guesses||{}).forEach(function(k){
    if(k===role)return;
    var col=ROLE_COLORS[k]||'#fff';
    var pos=state.guesses[k];
    allyMarkers[k]=L.marker(pos,{icon:L.divIcon({className:'',html:'<div style="width:18px;height:18px;border-radius:50%;background:'+col+';border:2px solid #fff;opacity:0.9;"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(mapL);
    html+='<div class="guess-legend-item" style="cursor:pointer;" onclick="goToGuess(\''+k+'\')"><div class="guess-dot" style="background:'+col+';"></div>'+(ROLE_LABELS[k]||k)+' 📍</div>';
  });
  panel.innerHTML=html;
  panel.style.display='block';
}
function goToVehicle(){if(state.vehiclePos)mapL.flyTo(state.vehiclePos,mapL.getZoom());}
function goToGuess(k){if(state.guesses&&state.guesses[k])mapL.flyTo(state.guesses[k],mapL.getZoom());}

function resetChase(){
  state={vehiclePos:null,guesses:{},revealed:false};
  vehicleTrail=[];
  pushState();
  if(vehicleMarker){mapL.removeLayer(vehicleMarker);vehicleMarker=null;}
  if(trailLine){mapL.removeLayer(trailLine);trailLine=null;}
  if(revealMarker){mapL.removeLayer(revealMarker);revealMarker=null;}
  Object.keys(guessMarkers).forEach(function(k){mapL.removeLayer(guessMarkers[k]);});
  guessMarkers={};
  renderAllGuesses();
}
function revealTruth(){
  state.revealed=true;
  pushState();
  renderReveal();
}

function connectMQTT(){
  try{
    mc=mqtt.connect(BROKER,{clientId:'cp'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    mc.on('connect',function(){mc.subscribe(topic);document.getElementById('conn-lbl').textContent='EN LIGNE';document.getElementById('conn-dot').className='cdot';});
    mc.on('message',function(t,p){
      try{
        var d=JSON.parse(p.toString());
        if(d.type==='state'){
          state=d.state;
          if(role==='mj'){renderAllGuesses();if(state.vehiclePos)renderVehicleFromState();}
          else{renderMyGuess();renderPlayerLegend();if(!state.revealed){var h=document.getElementById('player-hint');if(h)h.innerHTML='Clique sur la carte à l\'endroit où tu penses que le véhicule se trouve.';}}
          if(state.revealed)renderReveal();
        }
      }catch(e){}
    });
    mc.on('error',function(){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';});
  }catch(e){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';}
}
function renderVehicleFromState(){
  if(!state.vehiclePos)return;
  if(vehicleMarker)mapL.removeLayer(vehicleMarker);
  vehicleMarker=L.marker(state.vehiclePos,{icon:L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:#ff2040;border:3px solid #fff;box-shadow:0 0 14px #ff2040;"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(mapL);
}
function pushState(){if(mc&&mc.connected)mc.publish(topic,JSON.stringify({type:'state',state:state}),{retain:true});}

/* AUTO-CONNEXION */
(function(){
  var params=new URLSearchParams(window.location.search);
  var codeParam=params.get("code");
  var roleParam=params.get("role");
  if(codeParam){var lc=document.getElementById("lcode");if(lc)lc.value=codeParam;}
  if(roleParam)selRole(roleParam);
  if(codeParam&&roleParam){setTimeout(function(){go();},50);}
})();
</script>
