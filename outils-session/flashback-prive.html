<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FLASHBACK PRIVÉ — NEO-PARIS 2077</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{background:#07070d;color:#c8c8dc;font-family:'Share Tech Mono',monospace;min-height:100vh;}
#login{position:fixed;inset:0;z-index:100;background:#07070d;display:flex;align-items:center;justify-content:center;padding:20px;}
.lw{width:460px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:30px 26px;border:1px solid rgba(187,68,255,.25);border-radius:6px;background:rgba(15,5,20,.6);}
.ltitle{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;letter-spacing:3px;color:#bb44ff;text-align:center;}
.lsub{font-size:10px;letter-spacing:4px;color:rgba(187,68,255,.4);text-align:center;margin-bottom:8px;}
.llabel{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);margin-top:6px;}
#lcode{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:11px 14px;font-family:'Share Tech Mono',monospace;font-size:13px;color:#e8e8f0;outline:none;letter-spacing:2px;}
.lgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.lbtn{padding:10px 6px;border-radius:4px;border:1px solid;background:transparent;cursor:pointer;font-family:'Share Tech Mono',monospace;text-align:center;}
.lbtn b{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;display:block;}
.lbtn.on{background:rgba(255,255,255,.1);}
#lgo{border-color:#bb44ff;color:#bb44ff;margin-top:6px;padding:12px;}
#lerr{font-size:10px;color:#ff2040;letter-spacing:2px;min-height:14px;text-align:center;}
.rolecol-kiki{border-color:#ffaa00;color:#ffaa00;}
.rolecol-hunter{border-color:#00ccff;color:#00ccff;}
.rolecol-fury{border-color:#00ff88;color:#00ff88;}
.rolecol-keiyo{border-color:#ff33cc;color:#ff33cc;}
.rolecol-tamuro{border-color:#ff2040;color:#ff2040;}
.rolecol-mj{border-color:#e8e8f0;color:#e8e8f0;}

#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(15,5,20,.9);border-bottom:1px solid rgba(187,68,255,.15);}
.brand{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:3px;color:#bb44ff;}
.cdot{width:7px;height:7px;border-radius:50%;background:#00ff88;}
.cdot.err{background:#ff2040;}
.content{flex:1;padding:26px 18px 60px;max-width:560px;margin:0 auto;width:100%;}

.fb-intro{text-align:center;font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:22px;}
.fb-form{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.fb-form textarea{background:rgba(255,255,255,.04);border:1px solid rgba(187,68,255,.25);border-radius:8px;padding:12px 14px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:13px;min-height:70px;resize:vertical;}
.fb-send{padding:13px;border-radius:8px;border:2px solid #bb44ff;background:rgba(187,68,255,.08);color:#bb44ff;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;}

.fb-item{border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--c,#bb44ff);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:rgba(255,255,255,.02);}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.fb-author{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--c,#bb44ff);letter-spacing:1px;}
.fb-status{font-size:9px;letter-spacing:2px;padding:3px 10px;border-radius:10px;border:1px solid;}
.fb-status.attente{border-color:#ffaa00;color:#ffaa00;}
.fb-status.cours{border-color:#00ccff;color:#00ccff;}
.fb-status.termine{border-color:#00ff88;color:#00ff88;}
.fb-note{font-size:13px;color:rgba(255,255,255,.75);line-height:1.5;margin-bottom:10px;white-space:pre-wrap;}
.fb-mjnote{font-size:11px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.08);padding-top:8px;margin-top:8px;white-space:pre-wrap;}
.fb-ctrl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.fb-btn{padding:6px 12px;border-radius:5px;border:1px solid;background:transparent;font-size:10px;cursor:pointer;font-family:'Share Tech Mono',monospace;}
.fb-mjinput{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:6px 10px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:11px;margin-top:6px;}
.fb-empty{text-align:center;color:rgba(255,255,255,.25);padding:30px 0;font-size:12px;}
</style>
</head>
<body>
<div id="login">
  <div class="lw">
    <div class="ltitle">🎬 FLASHBACK PRIVÉ</div>
    <div class="lsub">// NEO-PARIS 2077 //</div>
    <div class="llabel">CODE DE SESSION</div>
    <input id="lcode" type="text" placeholder="Ex : neo_paris_2077" autocomplete="off">
    <div class="llabel">RÔLE</div>
    <div class="lgrid3">
      <button class="lbtn rolecol-tamuro" data-r="tamuro" onclick="selRole('tamuro')"><b>TAMURO</b></button>
      <button class="lbtn rolecol-kiki" data-r="kiki" onclick="selRole('kiki')"><b>KIKI</b></button>
      <button class="lbtn rolecol-fury" data-r="fury" onclick="selRole('fury')"><b>FURY</b></button>
    </div>
    <div class="lgrid3">
      <button class="lbtn rolecol-hunter" data-r="hunter" onclick="selRole('hunter')"><b>MOON</b></button>
      <button class="lbtn rolecol-keiyo" data-r="keiyo" onclick="selRole('keiyo')"><b>KEIYO</b></button>
      <button class="lbtn rolecol-mj" data-r="mj" onclick="selRole('mj')"><b>MJ</b></button>
    </div>
    <button class="lbtn" id="lgo" onclick="go()">▶ ENTRER</button>
    <div id="lerr"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="brand">🎬 FLASHBACK PRIVÉ</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;"><span id="conn-lbl">CONNEXION...</span><div class="cdot" id="conn-dot"></div></div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
var BROKER='wss://broker.emqx.io:8084/mqtt';
var role=null,sCode=null,mc=null,topic='';
var ROLE_LABELS={tamuro:'TAMURO',kiki:'KIKI',fury:'FURY',hunter:'MOON',keiyo:'KEIYO'};
var ROLE_COLORS={tamuro:'#ff2040',kiki:'#ffaa00',fury:'#00ff88',hunter:'#00ccff',keiyo:'#ff33cc'};
var state={requests:[]};

var selectedRole=null;
function selRole(r){selectedRole=r;document.querySelectorAll('.lbtn[data-r]').forEach(function(b){b.classList.toggle('on',b.dataset.r===r);});}
function go(){
  var code=document.getElementById('lcode').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!code||code.length<3){document.getElementById('lerr').textContent='Code trop court';return;}
  if(!selectedRole){document.getElementById('lerr').textContent='Choisis un rôle';return;}
  role=selectedRole;sCode=code;topic='spectre_flashback_v1_'+code;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  render();
  connectMQTT();
}
function connectMQTT(){
  try{
    mc=mqtt.connect(BROKER,{clientId:'fb'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    mc.on('connect',function(){mc.subscribe(topic);document.getElementById('conn-lbl').textContent='EN LIGNE';document.getElementById('conn-dot').className='cdot';});
    mc.on('message',function(t,p){try{var d=JSON.parse(p.toString());if(d.type==='state'){state=d.state;render();}}catch(e){}});
    mc.on('error',function(){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';});
  }catch(e){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';}
}
function pushState(){if(mc&&mc.connected)mc.publish(topic,JSON.stringify({type:'state',state:state}),{retain:true});}

function statusLabel(s){return s==='attente'?'EN ATTENTE':(s==='cours'?'EN COURS':'TERMINÉ');}

function render(){
  var c=document.getElementById('content');
  if(!state.requests)state.requests=[];
  if(role==='mj'){renderMJ(c);return;}
  var mine=state.requests.filter(function(r){return r.author===role;});
  var html='<div class="fb-intro">Envoie une demande au MJ pour déclencher un souvenir de ton personnage. Lui seul la voit — il t\'appellera à part pour la jouer pendant que la table continue.</div>'
    +'<div class="fb-form"><textarea id="fb-note" placeholder="Optionnel : un thème, une piste... (ex: quelque chose lié à mon passé chez Arasaka)"></textarea>'
    +'<button class="fb-send" onclick="sendRequest()">🎬 DÉCLENCHER UN FLASHBACK</button></div>';
  if(mine.length===0){
    html+='<div class="fb-empty">Aucune demande envoyée pour l\'instant.</div>';
  } else {
    mine.slice().reverse().forEach(function(r){
      html+='<div class="fb-item" style="--c:'+ROLE_COLORS[role]+';"><div class="fb-head"><span class="fb-author">TA DEMANDE</span><span class="fb-status '+r.status+'">'+statusLabel(r.status)+'</span></div>'
        +(r.note?'<div class="fb-note">'+esc(r.note)+'</div>':'<div class="fb-note" style="opacity:.5;">(sans thème précisé)</div>')+'</div>';
    });
  }
  c.innerHTML=html;
}
function sendRequest(){
  var note=document.getElementById('fb-note').value.trim();
  state.requests.push({id:Date.now(),author:role,note:note,status:'attente',mjNote:''});
  pushState();render();
}
function renderMJ(c){
  var reqs=state.requests.slice().sort(function(a,b){
    var order={attente:0,cours:1,termine:2};
    return order[a.status]-order[b.status]||b.id-a.id;
  });
  if(reqs.length===0){c.innerHTML='<div class="fb-empty">Aucune demande de flashback pour l\'instant.</div>';return;}
  var html='';
  reqs.forEach(function(r){
    var col=ROLE_COLORS[r.author]||'#bb44ff';
    html+='<div class="fb-item" style="--c:'+col+';"><div class="fb-head"><span class="fb-author">'+ROLE_LABELS[r.author]+'</span><span class="fb-status '+r.status+'">'+statusLabel(r.status)+'</span></div>'
      +(r.note?'<div class="fb-note">'+esc(r.note)+'</div>':'<div class="fb-note" style="opacity:.5;">(sans thème précisé)</div>')
      +'<div class="fb-ctrl">'
      +'<button class="fb-btn" style="border-color:#ffaa00;color:#ffaa00;" onclick="setStatus('+r.id+',\'attente\')">EN ATTENTE</button>'
      +'<button class="fb-btn" style="border-color:#00ccff;color:#00ccff;" onclick="setStatus('+r.id+',\'cours\')">EN COURS</button>'
      +'<button class="fb-btn" style="border-color:#00ff88;color:#00ff88;" onclick="setStatus('+r.id+',\'termine\')">TERMINÉ</button>'
      +'<button class="fb-btn" style="border-color:#ff2040;color:#ff2040;" onclick="deleteReq('+r.id+')">✕ SUPPRIMER</button>'
      +'</div>'
      +'<input class="fb-mjinput" placeholder="Note perso sur cette scène..." value="'+esc(r.mjNote||'')+'" onchange="setMjNote('+r.id+',this.value)">'
      +'</div>';
  });
  c.innerHTML=html;
}
function setStatus(id,s){
  var r=state.requests.find(function(x){return x.id===id;});
  if(r){r.status=s;pushState();render();}
}
function setMjNote(id,v){
  var r=state.requests.find(function(x){return x.id===id;});
  if(r){r.mjNote=v;pushState();}
}
function deleteReq(id){
  state.requests=state.requests.filter(function(x){return x.id!==id;});
  pushState();render();
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

(function(){
  var params=new URLSearchParams(window.location.search);
  var codeParam=params.get("code");
  var roleParam=params.get("role");
  if(codeParam){var lc=document.getElementById("lcode");if(lc)lc.value=codeParam;}
  if(roleParam)selRole(roleParam);
  if(codeParam&&roleParam){setTimeout(function(){go();},50);}
})();
</script>
</body>
</html>
