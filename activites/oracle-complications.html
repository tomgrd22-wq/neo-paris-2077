<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ORACLE DE COMPLICATIONS — NEO-PARIS 2077</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{background:#07070d;color:#c8c8dc;font-family:'Share Tech Mono',monospace;min-height:100vh;}
#login{position:fixed;inset:0;z-index:100;background:#07070d;display:flex;align-items:center;justify-content:center;padding:20px;}
.lw{width:400px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:30px 26px;border:1px solid rgba(255,32,64,.25);border-radius:6px;background:rgba(20,5,5,.6);}
.ltitle{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;letter-spacing:3px;color:#ff2040;text-align:center;}
.lsub{font-size:10px;letter-spacing:4px;color:rgba(255,32,64,.4);text-align:center;margin-bottom:8px;}
.llabel{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);margin-top:6px;}
#lcode{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:11px 14px;font-family:'Share Tech Mono',monospace;font-size:13px;color:#e8e8f0;outline:none;letter-spacing:2px;}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lbtn{padding:12px 6px;border-radius:4px;border:1px solid;background:transparent;cursor:pointer;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:1px;text-align:center;}
.lbtn.on{background:rgba(255,255,255,.1);}
.lbtn-p{border-color:#00ccff;color:#00ccff;}
.lbtn-m{border-color:#e8e8f0;color:#e8e8f0;}
#lgo{border-color:#ff2040;color:#ff2040;margin-top:6px;padding:12px;}
#lerr{font-size:10px;color:#ff2040;letter-spacing:2px;min-height:14px;text-align:center;}

#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(15,5,5,.9);border-bottom:1px solid rgba(255,32,64,.15);position:sticky;top:0;z-index:10;}
.brand{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:3px;color:#ff2040;}
.cdot{width:7px;height:7px;border-radius:50%;background:#00ff88;}
.cdot.err{background:#ff2040;}
.content{flex:1;padding:24px 18px 60px;max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}

.draw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;}
.draw-btn{padding:16px 10px;border-radius:8px;border:2px solid;background:transparent;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;text-align:center;}
.draw-btn.all{grid-column:1/3;padding:18px;}
.result-card{width:100%;max-width:420px;border-radius:10px;padding:20px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);text-align:center;min-height:60px;}
.result-cat{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;margin-bottom:8px;}
.result-txt{font-size:15px;color:#fff;line-height:1.5;}
.result-empty{color:rgba(255,255,255,.25);font-size:12px;padding:20px 0;}

.hist{width:100%;max-width:420px;}
.hist-title{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.3);margin-bottom:8px;text-align:center;}
.hist-item{display:flex;gap:8px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.02);margin-bottom:6px;font-size:11px;align-items:flex-start;}
.hist-tag{font-size:8px;letter-spacing:1px;padding:2px 6px;border-radius:8px;flex-shrink:0;margin-top:2px;}
.waiting{text-align:center;color:rgba(255,255,255,.3);font-size:12px;padding:20px 0;}
.clear-btn{font-size:10px;color:rgba(255,32,64,.6);background:none;border:none;cursor:pointer;letter-spacing:1px;text-decoration:underline;}
</style>
</head>
<body>
<div id="login">
  <div class="lw">
    <div class="ltitle">🎲 ORACLE</div>
    <div class="lsub">// NEO-PARIS 2077 //</div>
    <div class="llabel">CODE DE SESSION</div>
    <input id="lcode" type="text" placeholder="Ex : neo_paris_2077" autocomplete="off">
    <div class="llabel">RÔLE</div>
    <div class="lgrid">
      <button class="lbtn lbtn-p" data-r="joueur" onclick="selRole('joueur')">JOUEUR</button>
      <button class="lbtn lbtn-m" data-r="mj" onclick="selRole('mj')">MJ</button>
    </div>
    <button class="lbtn" id="lgo" onclick="go()">▶ ENTRER</button>
    <div id="lerr"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="brand">🎲 ORACLE DE COMPLICATIONS</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;"><span id="conn-lbl">CONNEXION...</span><div class="cdot" id="conn-dot"></div></div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
var BROKER='wss://broker.emqx.io:8084/mqtt';
var role=null,sCode=null,mc=null,topic='';
var state={history:[]};

var TABLES={
  complication:[
    "Une patrouille corpo (EuroTech ou concurrente) débarque au pire moment.",
    "L'équipement de quelqu'un tombe en panne pile maintenant.",
    "Un témoin inattendu voit tout — et n'a pas l'air content.",
    "Le plan initial vient de fuiter : quelqu'un savait déjà qu'ils venaient.",
    "Une coupure de courant plonge le quartier dans le noir pendant de longues secondes.",
    "Un ancien contact refait surface, au mauvais moment, avec une vieille dette à régler.",
    "Le signal réseau devient instable — Moon (ou tout netrunning) galère à distance.",
    "Une bagarre de rue sans rapport éclate juste à côté, attirant l'attention générale.",
    "Un allié PNJ se blesse ou panique, et devient un poids plutôt qu'un soutien.",
    "L'Unité Calypso vient d'obtenir une piste — pas encore leur position exacte, mais ça se rapproche.",
    "Quelqu'un reconnaît un des PJ, pour de mauvaises raisons.",
    "Le prix ou les conditions du contrat changent brusquement, sans prévenir.",
    "Un objet clé (datapad, arme, preuve) est endommagé ou compromis.",
    "La pluie acide tourne à l'orage — visibilité et déplacement affectés.",
    "Une rumeur commence à circuler sur le groupe dans les bas-fonds.",
    "Un PNJ mineur ment sur un point important, et ça ne se découvre pas tout de suite.",
    "Les renforts attendus (alliés, extraction) sont retardés.",
    "Un détail technique cloche : accès verrouillé, code changé, plan périmé.",
    "Une seconde faction s'intéresse soudain à la même cible que le groupe.",
    "Quelqu'un doit choisir entre deux urgences en même temps — impossible de tout couvrir."
  ],
  pnj:[
    "Un fixer nerveux, qui en sait plus qu'il ne le montre.",
    "Un garde corpo jeune, pas encore endurci, hésitant à tirer.",
    "Une nomade de passage, méfiante mais pas hostile.",
    "Un informateur des bas-fonds, prêt à tout vendre pour le bon prix.",
    "Un ancien edgerunner recyclé en barman, plein d'histoires et de contacts.",
    "Un technicien corpo débordé, plus intéressé par sa pause que par sa mission.",
    "Une journaliste indépendante, qui sent une bonne histoire.",
    "Un enforcer local, territorial, qui n'aime pas les inconnus dans son secteur.",
    "Un médecin de rue façon Fury, débordé, qui demande un service en échange d'aide.",
    "Un enfant des rues, trop observateur, qui a vu quelque chose d'important.",
    "Un cadre EuroTech de passage, arrogant, qui sous-estime tout le monde.",
    "Un ripou de la sécurité privée, corruptible si le prix est juste.",
    "Un ancien contact de Tamuro, resurgi du passé sans prévenir.",
    "Une voix au téléphone, jamais vue, qui semble tout savoir sur eux.",
    "Un livreur ordinaire, au mauvais endroit au mauvais moment, terrifié."
  ],
  lieu:[
    "Un parking souterrain à moitié effondré, mal éclairé.",
    "Un marché de rue bondé du Niveau I, bruyant et anonyme.",
    "Un rooftop du Niveau III, vent fort, vue dégagée sur toute la ville.",
    "Un atelier clandestin, empli de matériel volé et de gaz d'échappement.",
    "Une rame de métro à l'arrêt, portes bloquées, lumières clignotantes.",
    "Un bar miteux, presque vide, une seule serveuse qui ne pose pas de questions.",
    "Un entrepôt corpo désaffecté, caméras hors service depuis des mois — en théorie.",
    "Une clinique de rue façon fourgon de Fury, matériel de fortune partout.",
    "Un couloir de maintenance étroit, sombre, qui sent le métal chaud.",
    "Une place publique du Bas, foule dense, parfaite pour se fondre ou se perdre.",
    "Un night-club aux néons agressifs, musique trop forte pour s'entendre parler.",
    "Un pont piéton suspendu entre deux tours, à découvert.",
    "Un data-center miniature planqué dans un sous-sol résidentiel.",
    "Un terrain vague en bordure de ville, dernier bout de vraie nuit noire.",
    "Un poste de contrôle routier improvisé, avec ou sans autorité légale."
  ]
};
var LBL={complication:'COMPLICATION',pnj:'PNJ IMPROVISÉ',lieu:'LIEU'};
var COL={complication:'#ff2040',pnj:'#00ccff',lieu:'#ffaa00'};

var selectedRole=null;
function selRole(r){selectedRole=r;document.querySelectorAll('.lbtn[data-r]').forEach(function(b){b.classList.toggle('on',b.dataset.r===r);});}
function go(){
  var code=document.getElementById('lcode').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!code||code.length<3){document.getElementById('lerr').textContent='Code trop court';return;}
  if(!selectedRole){document.getElementById('lerr').textContent='Choisis un rôle';return;}
  role=selectedRole;sCode=code;topic='spectre_oracle_v1_'+code;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  render();
  connectMQTT();
}
function connectMQTT(){
  try{
    mc=mqtt.connect(BROKER,{clientId:'or'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    mc.on('connect',function(){
      mc.subscribe(topic);
      document.getElementById('conn-lbl').textContent='EN LIGNE';document.getElementById('conn-dot').className='cdot';
      if(role!=='mj')mc.publish(topic,JSON.stringify({type:'requestState'}));
    });
    mc.on('message',function(t,p){
      try{
        var d=JSON.parse(p.toString());
        if(d.type==='state'){state=d.state;render();}
        else if(d.type==='requestState'&&role==='mj'){pushState();}
      }catch(e){}
    });
    mc.on('error',function(){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';});
  }catch(e){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';}
}
function pushState(){if(mc&&mc.connected)mc.publish(topic,JSON.stringify({type:'state',state:state}),{retain:true});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function render(){
  var c=document.getElementById('content');
  var last=state.history&&state.history.length?state.history[0]:null;
  var html='';
  if(role==='mj'){
    html+='<div class="draw-grid">'
      +'<button class="draw-btn" style="border-color:'+COL.complication+';color:'+COL.complication+';" onclick="draw(\'complication\')">⚡ COMPLICATION</button>'
      +'<button class="draw-btn" style="border-color:'+COL.pnj+';color:'+COL.pnj+';" onclick="draw(\'pnj\')">🙂 PNJ</button>'
      +'<button class="draw-btn" style="border-color:'+COL.lieu+';color:'+COL.lieu+';" onclick="draw(\'lieu\')">📍 LIEU</button>'
      +'<button class="draw-btn" style="border-color:#e8e8f0;color:#e8e8f0;" onclick="drawAll()">🎲 SCÈNE COMPLÈTE</button>'
      +'</div>';
  }
  if(last){
    html+='<div class="result-card" style="border-color:'+COL[last.cat]+';">'
      +'<div class="result-cat" style="color:'+COL[last.cat]+';">'+LBL[last.cat]+'</div>'
      +'<div class="result-txt">'+esc(last.text)+'</div></div>';
  }else{
    html+='<div class="result-card"><div class="result-empty">'+(role==='mj'?'Tire une carte ci-dessus.':'En attente d\'un tirage du MJ...')+'</div></div>';
  }
  if(state.history&&state.history.length>1){
    html+='<div class="hist"><div class="hist-title">HISTORIQUE'+(role==='mj'?' <button class="clear-btn" onclick="clearHist()">EFFACER</button>':'')+'</div>';
    state.history.slice(1,15).forEach(function(h){
      html+='<div class="hist-item"><span class="hist-tag" style="background:'+COL[h.cat]+'22;color:'+COL[h.cat]+';border:1px solid '+COL[h.cat]+'55;">'+LBL[h.cat]+'</span><span>'+esc(h.text)+'</span></div>';
    });
    html+='</div>';
  }
  c.innerHTML=html;
}
function draw(cat){
  var text=pick(TABLES[cat]);
  if(!state.history)state.history=[];
  state.history.unshift({cat:cat,text:text});
  pushState();render();
}
function drawAll(){
  var c=pick(TABLES.complication),p=pick(TABLES.pnj),l=pick(TABLES.lieu);
  if(!state.history)state.history=[];
  state.history.unshift({cat:'lieu',text:l});
  state.history.unshift({cat:'pnj',text:p});
  state.history.unshift({cat:'complication',text:c});
  pushState();render();
}
function clearHist(){state.history=[];pushState();render();}

(function(){
  var params=new URLSearchParams(window.location.search);
  var codeParam=params.get("code");
  var roleParam=params.get("role");
  if(codeParam){var lc=document.getElementById("lcode");if(lc)lc.value=codeParam;}
  if(roleParam)selRole((roleParam==='mj')?'mj':'joueur');
  if(codeParam&&roleParam){setTimeout(function(){go();},50);}
})();
</script>
</body>
</html>
