<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INTERROGATOIRE — NEO-PARIS 2077</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{background:#07070d;color:#c8c8dc;font-family:'Share Tech Mono',monospace;min-height:100vh;}
#login{position:fixed;inset:0;z-index:100;background:#07070d;display:flex;align-items:center;justify-content:center;padding:20px;}
.lw{width:400px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:30px 26px;border:1px solid rgba(255,32,64,.25);border-radius:6px;background:rgba(20,5,5,.6);}
.ltitle{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;letter-spacing:3px;color:#ff2040;text-align:center;}
.lsub{font-size:10px;letter-spacing:4px;color:rgba(255,32,64,.4);text-align:center;margin-bottom:8px;}
.llabel{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);margin-top:6px;}
#lcode{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:11px 14px;font-family:'Share Tech Mono',monospace;font-size:13px;color:#e8e8f0;outline:none;letter-spacing:2px;}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lbtn{padding:12px 6px;border-radius:4px;border:1px solid;background:transparent;cursor:pointer;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:1px;text-align:center;}
.lbtn.on{background:rgba(255,255,255,.1);}
.lbtn-p{border-color:#00ccff;color:#00ccff;}
.lbtn-m{border-color:#e8e8f0;color:#e8e8f0;}
#lgo{border-color:#ff2040;color:#ff2040;margin-top:6px;padding:12px;}
#lerr{font-size:10px;color:#ff2040;letter-spacing:2px;min-height:14px;text-align:center;}

#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(15,5,5,.9);border-bottom:1px solid rgba(255,32,64,.15);}
.brand{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:3px;color:#ff2040;}
.cdot{width:7px;height:7px;border-radius:50%;background:#00ff88;}
.cdot.err{background:#ff2040;}
.content{flex:1;padding:30px 20px 60px;max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;}

.subject{font-family:'Orbitron',monospace;font-size:16px;letter-spacing:1px;color:#fff;text-align:center;}
.gauge-wrap{width:100%;max-width:420px;}
.gauge-labels{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;margin-bottom:6px;}
.gauge-bar{height:34px;border-radius:17px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative;}
.gauge-fill{height:100%;transition:width .5s,background .5s;}
.gauge-marker{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.4);left:50%;}
.gauge-val{text-align:center;font-family:'Orbitron',monospace;font-size:13px;margin-top:8px;color:rgba(255,255,255,.5);}

.mj-setup{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;}
.mj-setup input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:10px 12px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:13px;}
.mg-btn{padding:12px 20px;border:2px solid #ff2040;border-radius:8px;background:rgba(255,32,64,.08);color:#ff2040;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;}

.ctrl-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.tbtn{padding:12px 18px;border-radius:8px;border:1px solid;background:transparent;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;cursor:pointer;}
.approach-lbl{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.3);text-align:center;margin-top:6px;}
.waiting{text-align:center;color:rgba(255,255,255,.3);font-size:12px;padding:30px 0;}
</style>
</head>
<body>
<div id="login">
  <div class="lw">
    <div class="ltitle">🎭 INTERROGATOIRE</div>
    <div class="lsub">// NEO-PARIS 2077 //</div>
    <div class="llabel">CODE DE SESSION</div>
    <input id="lcode" type="text" placeholder="Ex : neo_paris_2077" autocomplete="off">
    <div class="llabel">RÔLE</div>
    <div class="lgrid">
      <button class="lbtn lbtn-p" data-r="joueur" onclick="selRole('joueur')">JOUEUR</button>
      <button class="lbtn lbtn-m" data-r="mj" onclick="selRole('mj')">MJ</button>
    </div>
    <button class="lbtn" id="lgo" onclick="go()">▶ ENTRER</button>
    <div id="lerr"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="brand">🎭 INTERROGATOIRE</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;"><span id="conn-lbl">CONNEXION...</span><div class="cdot" id="conn-dot"></div></div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
var BROKER='wss://broker.emqx.io:8084/mqtt';
var role=null,sCode=null,mc=null,topic='';
var state={active:false,subject:'',trust:50};

var selectedRole=null;
function selRole(r){selectedRole=r;document.querySelectorAll('.lbtn[data-r]').forEach(function(b){b.classList.toggle('on',b.dataset.r===r);});}
function go(){
  var code=document.getElementById('lcode').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!code||code.length<3){document.getElementById('lerr').textContent='Code trop court';return;}
  if(!selectedRole){document.getElementById('lerr').textContent='Choisis un rôle';return;}
  role=selectedRole;sCode=code;topic='spectre_interro_v1_'+code;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  render();
  connectMQTT();
}
function connectMQTT(){
  try{
    mc=mqtt.connect(BROKER,{clientId:'ig'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    mc.on('connect',function(){mc.subscribe(topic);document.getElementById('conn-lbl').textContent='EN LIGNE';document.getElementById('conn-dot').className='cdot';});
    mc.on('message',function(t,p){try{var d=JSON.parse(p.toString());if(d.type==='state'){state=d.state;render();}}catch(e){}});
    mc.on('error',function(){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';});
  }catch(e){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';}
}
function pushState(){if(mc&&mc.connected)mc.publish(topic,JSON.stringify({type:'state',state:state}),{retain:true});}

function trustColor(v){if(v<34)return '#ff2040';if(v<67)return '#ffaa00';return '#00ff88';}
function trustLabel(v){if(v<20)return 'HOSTILE — VA TOUT NIER';if(v<40)return 'MÉFIANT';if(v<60)return 'INCERTAIN';if(v<80)return 'RÉCEPTIF';return 'PRÊT À PARLER';}

function render(){
  var c=document.getElementById('content');
  if(role==='mj'){renderMJ(c);return;}
  if(!state.active){c.innerHTML='<div class="waiting">En attente qu\'un interrogatoire commence...</div>';return;}
  renderGauge(c,false);
}
function renderGauge(c,isMJ){
  var v=state.trust;
  var col=trustColor(v);
  var html='<div class="subject">🎙 '+esc(state.subject||'Sujet inconnu')+'</div>'
    +'<div class="gauge-wrap"><div class="gauge-labels"><span style="color:#ff2040;">HOSTILE</span><span style="color:#00ff88;">COOPÉRATIF</span></div>'
    +'<div class="gauge-bar"><div class="gauge-fill" style="width:'+v+'%;background:'+col+';"></div><div class="gauge-marker"></div></div>'
    +'<div class="gauge-val" style="color:'+col+';">'+trustLabel(v)+' ('+v+'%)</div></div>';
  if(isMJ){
    html+='<div class="approach-lbl">APPROCHE ADOPTÉE PAR LE GROUPE</div>'
      +'<div class="ctrl-grid">'
      +'<button class="tbtn" style="border-color:#ff2040;color:#ff2040;" onclick="adjTrust(-15)">INTIMIDER (−15)</button>'
      +'<button class="tbtn" style="border-color:#ff2040;color:#ff2040;" onclick="adjTrust(-5)">PRESSION (−5)</button>'
      +'<button class="tbtn" style="border-color:#00ff88;color:#00ff88;" onclick="adjTrust(5)">EMPATHIE (+5)</button>'
      +'<button class="tbtn" style="border-color:#00ff88;color:#00ff88;" onclick="adjTrust(15)">MARCHÉ (+15)</button>'
      +'</div>'
      +'<button class="mg-btn" style="margin-top:14px;" onclick="endInterro()">✕ TERMINER L\'INTERROGATOIRE</button>';
  }
  c.innerHTML=html;
}
function renderMJ(c){
  if(!state.active){
    c.innerHTML='<div class="mj-setup"><div class="llabel">SUJET DE L\'INTERROGATOIRE</div>'
      +'<input id="mj-subject" type="text" placeholder="Ex: Le garde d\'EuroTech capturé">'
      +'<div class="llabel">CONFIANCE DE DÉPART (0-100)</div>'
      +'<input id="mj-start" type="number" value="50" min="0" max="100">'
      +'<button class="mg-btn" onclick="startInterro()">▶ LANCER L\'INTERROGATOIRE</button></div>';
    return;
  }
  renderGauge(c,true);
}
function startInterro(){
  var subj=document.getElementById('mj-subject').value.trim()||'Sujet inconnu';
  var start=parseInt(document.getElementById('mj-start').value)||50;
  state={active:true,subject:subj,trust:Math.max(0,Math.min(100,start))};
  pushState();render();
}
function adjTrust(d){state.trust=Math.max(0,Math.min(100,state.trust+d));pushState();render();}
function endInterro(){state={active:false,subject:'',trust:50};pushState();render();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

(function(){
  var params=new URLSearchParams(window.location.search);
  var codeParam=params.get("code");
  var roleParam=params.get("role");
  if(codeParam){var lc=document.getElementById("lcode");if(lc)lc.value=codeParam;}
  if(roleParam)selRole((roleParam==='mj')?'mj':'joueur');
  if(codeParam&&roleParam){setTimeout(function(){go();},50);}
})();
</script>
</body>
</html>
