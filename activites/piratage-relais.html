<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PIRATAGE EN RELAIS — NEO-PARIS 2077</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
html,body{background:#07070d;color:#c8c8dc;font-family:'Share Tech Mono',monospace;min-height:100vh;}
#login{position:fixed;inset:0;z-index:100;background:#07070d;display:flex;align-items:center;justify-content:center;padding:20px;}
.lw{width:460px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:30px 26px;border:1px solid rgba(0,204,255,.25);border-radius:6px;background:rgba(5,15,20,.6);}
.ltitle{font-family:'Orbitron',monospace;font-size:17px;font-weight:900;letter-spacing:3px;color:#00ccff;text-align:center;}
.lsub{font-size:10px;letter-spacing:4px;color:rgba(0,204,255,.4);text-align:center;margin-bottom:8px;}
.llabel{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);margin-top:6px;}
#lcode{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:11px 14px;font-family:'Share Tech Mono',monospace;font-size:13px;color:#e8e8f0;outline:none;letter-spacing:2px;}
.lgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.lbtn{padding:10px 6px;border-radius:4px;border:1px solid;background:transparent;cursor:pointer;font-family:'Share Tech Mono',monospace;text-align:center;}
.lbtn b{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;display:block;}
.lbtn.on{background:rgba(255,255,255,.1);}
#lgo{border-color:#00ccff;color:#00ccff;margin-top:6px;padding:12px;}
#lerr{font-size:10px;color:#ff2040;letter-spacing:2px;min-height:14px;text-align:center;}
.rolecol-kiki{border-color:#ffaa00;color:#ffaa00;}
.rolecol-hunter{border-color:#00ccff;color:#00ccff;}
.rolecol-fury{border-color:#00ff88;color:#00ff88;}
.rolecol-keiyo{border-color:#ff33cc;color:#ff33cc;}
.rolecol-tamuro{border-color:#ff2040;color:#ff2040;}
.rolecol-mj{border-color:#e8e8f0;color:#e8e8f0;}

#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(5,15,20,.9);border-bottom:1px solid rgba(0,204,255,.15);}
.brand{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;letter-spacing:3px;color:#00ccff;}
.cdot{width:7px;height:7px;border-radius:50%;background:#00ff88;}
.cdot.err{background:#ff2040;}
.content{flex:1;padding:26px 20px 60px;max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}

.chain{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.chain-node{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;}
.chain-node.done{border-color:#00ff88;background:rgba(0,255,136,.15);}
.chain-node.failed{border-color:#ff2040;background:rgba(255,32,64,.15);}
.chain-node.current{border-color:#00ccff;background:rgba(0,204,255,.15);box-shadow:0 0 12px rgba(0,204,255,.5);}

.timing-bar{width:100%;max-width:400px;height:44px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);position:relative;overflow:hidden;}
.timing-zone{position:absolute;top:0;bottom:0;background:rgba(0,255,136,.35);border-left:2px solid #00ff88;border-right:2px solid #00ff88;}
.timing-marker{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 8px #fff;}
.difficulty-lbl{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.4);}
.mg-btn{padding:14px 30px;border:2px solid #00ccff;border-radius:8px;background:rgba(0,204,255,.08);color:#00ccff;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;}
.tbtn{padding:9px 14px;border-radius:6px;border:1px solid;background:transparent;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;cursor:pointer;}
.mj-setup{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;}
.mj-setup input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:10px 12px;color:#fff;font-family:'Share Tech Mono',monospace;font-size:13px;}
.waiting{text-align:center;color:rgba(255,255,255,.3);font-size:13px;padding:20px 0;}
.result-title{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;text-align:center;}
</style>
</head>
<body>
<div id="login">
  <div class="lw">
    <div class="ltitle">🔗 PIRATAGE EN RELAIS</div>
    <div class="lsub">// NEO-PARIS 2077 //</div>
    <div class="llabel">CODE DE SESSION</div>
    <input id="lcode" type="text" placeholder="Ex : neo_paris_2077" autocomplete="off">
    <div class="llabel">RÔLE</div>
    <div class="lgrid3">
      <button class="lbtn rolecol-tamuro" data-r="tamuro" onclick="selRole('tamuro')"><b>TAMURO</b></button>
      <button class="lbtn rolecol-kiki" data-r="kiki" onclick="selRole('kiki')"><b>KIKI</b></button>
      <button class="lbtn rolecol-fury" data-r="fury" onclick="selRole('fury')"><b>FURY</b></button>
    </div>
    <div class="lgrid3">
      <button class="lbtn rolecol-hunter" data-r="hunter" onclick="selRole('hunter')"><b>MOON</b></button>
      <button class="lbtn rolecol-keiyo" data-r="keiyo" onclick="selRole('keiyo')"><b>KEIYO</b></button>
      <button class="lbtn rolecol-mj" data-r="mj" onclick="selRole('mj')"><b>MJ</b></button>
    </div>
    <button class="lbtn" id="lgo" onclick="go()">▶ ENTRER</button>
    <div id="lerr"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="brand">🔗 PIRATAGE EN RELAIS</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;"><span id="conn-lbl">CONNEXION...</span><div class="cdot" id="conn-dot"></div></div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
var BROKER='wss://broker.emqx.io:8084/mqtt';
var role=null,sCode=null,mc=null,topic='';
var ROLE_LABELS={tamuro:'TAMURO',kiki:'KIKI',fury:'FURY',hunter:'MOON',keiyo:'KEIYO'};
var ROLE_COLORS={tamuro:'#ff2040',kiki:'#ffaa00',fury:'#00ff88',hunter:'#00ccff',keiyo:'#ff33cc'};
var ORDER=['tamuro','kiki','fury','hunter','keiyo'];
var state={phase:'idle',turnIdx:0,fails:0,results:[],zoneW:16,speed:2.2,present:{tamuro:true,kiki:true,fury:true,hunter:true,keiyo:true},order:ORDER.slice()};
var markerPos=0,markerDir=1,tickInt=null;

var selectedRole=null;
function selRole(r){selectedRole=r;document.querySelectorAll('.lbtn[data-r]').forEach(function(b){b.classList.toggle('on',b.dataset.r===r);});}
function go(){
  var code=document.getElementById('lcode').value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!code||code.length<3){document.getElementById('lerr').textContent='Code trop court';return;}
  if(!selectedRole){document.getElementById('lerr').textContent='Choisis un rôle';return;}
  role=selectedRole;sCode=code;topic='spectre_relais_v1_'+code;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  render();
  connectMQTT();
}
function connectMQTT(){
  try{
    mc=mqtt.connect(BROKER,{clientId:'rl'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    mc.on('connect',function(){mc.subscribe(topic);document.getElementById('conn-lbl').textContent='EN LIGNE';document.getElementById('conn-dot').className='cdot';});
    mc.on('message',function(t,p){try{var d=JSON.parse(p.toString());if(d.type==='state'){state=d.state;render();}}catch(e){}});
    mc.on('error',function(){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';});
  }catch(e){document.getElementById('conn-lbl').textContent='HORS LIGNE';document.getElementById('conn-dot').className='cdot err';}
}
function pushState(){if(mc&&mc.connected)mc.publish(topic,JSON.stringify({type:'state',state:state}),{retain:true});}

function render(){
  var c=document.getElementById('content');
  if(clockInt){clearInterval(clockInt);clockInt=null;}
  if(role==='mj'){renderMJ(c);return;}
  if(state.phase==='idle'){c.innerHTML='<div class="waiting">En attente que le MJ lance le piratage en relais...</div>';return;}
  if(state.phase==='done'){renderResult(c);return;}
  var order=state.order||ORDER;
  if(!state.present||state.present[role]===false){
    c.innerHTML='<div class="waiting">Tu es marqué absent pour ce piratage — installe-toi confortablement.</div>';
    return;
  }
  var chainHtml=renderChain();
  if(order[state.turnIdx]!==role){
    c.innerHTML=chainHtml+'<div class="waiting">Ce n\'est pas ton tour — c\'est à <b style="color:'+ROLE_COLORS[order[state.turnIdx]]+';">'+ROLE_LABELS[order[state.turnIdx]]+'</b> de jouer.</div>';
    return;
  }
  c.innerHTML=chainHtml
    +'<div class="difficulty-lbl">Zone : '+Math.round(state.zoneW)+'% — Vitesse ×'+state.speed.toFixed(1)+'</div>'
    +'<div class="timing-bar" id="tbar"><div class="timing-zone" id="tzone"></div><div class="timing-marker" id="tmarker"></div></div>'
    +'<button class="mg-btn" onclick="attemptHack()">🎯 VALIDER</button>';
  setupTimingBar();
}
function renderChain(){
  var order=state.order||ORDER;
  var html='<div class="chain">';
  order.forEach(function(k,i){
    var cls=i<state.results.length?(state.results[i]?'done':'failed'):(i===state.turnIdx?'current':'');
    html+='<div class="chain-node '+cls+'" style="color:'+ROLE_COLORS[k]+';border-color:'+(cls?'':ROLE_COLORS[k]+'55')+';">'+ROLE_LABELS[k][0]+'</div>';
  });
  return html+'</div>';
}
function renderResult(c){
  var success=state.fails<3;
  c.innerHTML='<div class="result-title" style="color:'+(success?'#00ff88':'#ff2040')+';">'+(success?'✓ SYSTÈME PERCÉ':'✗ ALARME DÉCLENCHÉE')+'</div>'
    +renderChain()
    +'<div class="waiting">'+state.fails+' échec(s) sur la chaîne.</div>'
    +(role==='mj'?'<button class="mg-btn" onclick="resetRelay()">↺ NOUVEAU PIRATAGE</button>':'');
}
function setupTimingBar(){
  markerPos=0;markerDir=1;
  var zone=document.getElementById('tzone');
  var zoneLeft=50-state.zoneW/2;
  zone.style.left=zoneLeft+'%';zone.style.width=state.zoneW+'%';
  if(tickInt)clearInterval(tickInt);
  tickInt=setInterval(function(){
    var jitter=0.75+Math.random()*0.5; /* la vitesse fluctue légèrement — impossible de compter le rythme */
    markerPos+=markerDir*state.speed*jitter;
    if(markerPos>=100){markerPos=100;markerDir=-1;}
    if(markerPos<=0){markerPos=0;markerDir=1;}
    var m=document.getElementById('tmarker');if(m)m.style.left=markerPos+'%';
  },20);
}
function attemptHack(){
  if(tickInt){clearInterval(tickInt);tickInt=null;}
  var zoneLeft=50-state.zoneW/2,zoneRight=50+state.zoneW/2;
  var success=(markerPos>=zoneLeft&&markerPos<=zoneRight);
  state.results.push(success);
  /* le pare-feu se resserre à CHAQUE segment, même réussi — le relais devient plus dur pour le suivant */
  state.zoneW=Math.max(6,state.zoneW-2);
  state.speed=Math.min(4.5,state.speed+0.15);
  if(!success){
    state.fails++;
    state.zoneW=Math.max(6,state.zoneW-4);
    state.speed=Math.min(4.5,state.speed+0.3);
  }
  var order=state.order||ORDER;
  state.turnIdx++;
  if(state.turnIdx>=order.length||state.fails>=3){state.phase='done';}
  pushState();render();
}
function togglePresent(r){
  if(!state.present)state.present={tamuro:true,kiki:true,fury:true,hunter:true,keiyo:true};
  state.present[r]=(state.present[r]===false);
  pushState();render();
}
function renderMJ(c){
  if(state.phase==='idle'){
    var present=state.present||{tamuro:true,kiki:true,fury:true,hunter:true,keiyo:true};
    var absentCount=ORDER.filter(function(r){return present[r]===false;}).length;
    c.innerHTML='<div class="mj-setup"><div class="llabel">JOUEURS PRÉSENTS CE SOIR</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;">'+ORDER.map(function(r){
        var on=present[r]!==false;
        return '<button class="tbtn" style="border-color:'+ROLE_COLORS[r]+';color:'+(on?ROLE_COLORS[r]:'rgba(255,255,255,.3)')+';'+(on?'':'text-decoration:line-through;opacity:.5;')+'" onclick="togglePresent(\''+r+'\')">'+ROLE_LABELS[r]+(on?'':' (absent)')+'</button>';
      }).join('')+'</div>'
      +'<div class="difficulty-lbl">Clique sur un nom pour le marquer absent — il est retiré du relais, l\'ordre de passage s\'adapte automatiquement.</div>'
      +'<div class="llabel">DIFFICULTÉ INITIALE</div>'
      +'<div style="display:flex;gap:8px;"><input id="mj-zone" type="number" value="16" min="6" max="40" placeholder="Largeur zone %"><input id="mj-speed" type="number" value="2.2" step="0.1" min="0.5" max="4" placeholder="Vitesse"></div>'
      +'<div class="difficulty-lbl">La zone se resserre et la vitesse augmente à chaque segment, même en cas de réussite. Un échec accélère encore plus la difficulté pour le joueur suivant.</div>'
      +(absentCount>=ORDER.length?'<div class="difficulty-lbl" style="color:#ff2040;">Il faut au moins un joueur présent.</div>':'<button class="mg-btn" onclick="startRelay()">▶ LANCER LE PIRATAGE</button>')
      +'</div>';
    return;
  }
  if(state.phase==='done'){renderResult(c);return;}
  var order=state.order||ORDER;
  c.innerHTML=renderChain()
    +'<div class="waiting">Tour actuel : <b style="color:'+ROLE_COLORS[order[state.turnIdx]]+';">'+ROLE_LABELS[order[state.turnIdx]]+'</b></div>'
    +'<div class="difficulty-lbl">Échecs : '+state.fails+'/3 — Zone : '+Math.round(state.zoneW)+'% — Vitesse ×'+state.speed.toFixed(1)+'</div>';
}
function startRelay(){
  var zw=parseFloat(document.getElementById('mj-zone').value)||16;
  var sp=parseFloat(document.getElementById('mj-speed').value)||2.2;
  var present=state.present||{tamuro:true,kiki:true,fury:true,hunter:true,keiyo:true};
  var order=ORDER.filter(function(r){return present[r]!==false;});
  if(order.length===0)return;
  state={phase:'running',turnIdx:0,fails:0,results:[],zoneW:zw,speed:sp,present:present,order:order};
  pushState();render();
}
function resetRelay(){
  var present=state.present||{tamuro:true,kiki:true,fury:true,hunter:true,keiyo:true};
  state={phase:'idle',turnIdx:0,fails:0,results:[],zoneW:16,speed:2.2,present:present,order:ORDER.filter(function(r){return present[r]!==false;})};
  pushState();render();
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var clockInt=null;

(function(){
  var params=new URLSearchParams(window.location.search);
  var codeParam=params.get("code");
  var roleParam=params.get("role");
  if(codeParam){var lc=document.getElementById("lcode");if(lc)lc.value=codeParam;}
  if(roleParam)selRole(roleParam);
  if(codeParam&&roleParam){setTimeout(function(){go();},50);}
})();
</script>
</body>
</html>
