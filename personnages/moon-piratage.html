<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MOON — Piratage // Neo-Paris 2077</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#03080c;color:#bfeaff;font-family:'Share Tech Mono',monospace;min-height:100%;}
body{background:radial-gradient(ellipse at 50% -10%,#06243a,#03080c 60%);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);}
.back{position:fixed;top:10px;left:10px;z-index:60;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.45);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:4px;background:#03080c;}
.wrap{max-width:900px;margin:0 auto;padding:54px 14px 40px;}
h1{font-family:'Orbitron',monospace;font-size:22px;letter-spacing:5px;color:#00ccff;text-align:center;margin:0;text-shadow:0 0 16px rgba(0,204,255,.6);}
.sub{text-align:center;font-size:10px;letter-spacing:3px;color:rgba(0,204,255,.45);margin:4px 0 20px;}
h2{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;color:rgba(0,204,255,.6);margin:18px 0 10px;}
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.tg{text-align:left;border:1px solid rgba(0,204,255,.3);background:rgba(0,204,255,.04);color:#bfeaff;border-radius:8px;padding:12px;cursor:pointer;font-family:inherit;transition:.2s;}
.tg:hover{background:rgba(0,204,255,.12);box-shadow:0 0 18px rgba(0,204,255,.2);}
.tg b{display:block;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:1px;color:#00ccff;margin:4px 0;}
.tg small{display:block;font-size:10px;color:rgba(255,255,255,.5);line-height:1.5;}
.tg .lv{font-size:9px;letter-spacing:2px;color:#ffaa00;}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;}
.timer{flex:1;min-width:140px;height:10px;border:1px solid rgba(0,204,255,.4);border-radius:5px;overflow:hidden;}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#00ccff,#ff33cc);width:100%;}
.game{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;}
@media(max-width:680px){.game{grid-template-columns:1fr;}}
.box{border:1px solid rgba(0,204,255,.25);border-radius:8px;padding:12px;background:rgba(0,10,18,.7);}
.box h3{margin:0 0 8px;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;color:rgba(0,204,255,.7);}
.mx{display:grid;gap:6px;}
.cell{aspect-ratio:1;border:1px solid rgba(0,204,255,.25);border-radius:5px;background:transparent;color:#bfeaff;font-family:'Share Tech Mono',monospace;font-size:clamp(13px,3.6vw,20px);cursor:pointer;transition:.12s;}
.cell.ok{border-color:#ffe94a;color:#ffe94a;box-shadow:0 0 10px rgba(255,233,74,.25);}
.cell.ok:hover{background:rgba(255,233,74,.18);}
.cell.used{opacity:.18;cursor:default;border-style:dashed;}
.cell.dim{opacity:.35;cursor:default;}
.cell.ice{color:#ff2040;border-color:rgba(255,32,64,.5);background:repeating-linear-gradient(45deg,rgba(255,32,64,.12),rgba(255,32,64,.12) 4px,transparent 4px,transparent 8px);}
.cell.hint{background:rgba(255,51,204,.25);}
.buf{display:flex;gap:6px;flex-wrap:wrap;}
.slot{width:38px;height:38px;border:1px solid rgba(0,204,255,.35);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ffe94a;}
.slot.f{background:rgba(255,233,74,.07);}
.dm{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px;margin-bottom:8px;}
.dm.done{border-color:#00ff88;background:rgba(0,255,136,.07);}
.dm.fail{border-color:rgba(255,32,64,.5);opacity:.55;}
.dm .seq{display:flex;gap:5px;margin:5px 0;}
.dm .seq span{padding:4px 6px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:12px;}
.dm .seq span.m{color:#05050a;background:#ffe94a;border-color:#ffe94a;}
.dm b{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:1px;color:#00ccff;}
.dm small{font-size:10px;color:rgba(255,255,255,.5);display:block;}
.btn{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;padding:10px 18px;border-radius:6px;border:1px solid #00ccff;color:#00ccff;background:rgba(0,204,255,.08);cursor:pointer;}
.btn:hover{background:rgba(0,204,255,.2);}
.res{text-align:center;padding:24px 10px;}
.res h2{font-size:20px;margin:0 0 8px;letter-spacing:5px;}
.res.win h2{color:#00ff88;text-shadow:0 0 16px #00ff88;}.res.part h2{color:#ffaa00;}.res.lose h2{color:#ff2040;text-shadow:0 0 16px #ff2040;}
.fx{max-width:480px;margin:10px auto;text-align:left;font-size:12px;line-height:1.8;}
.fx div::before{content:'▸ ';color:#00ccff;}
.log{font-size:10px;line-height:1.7;color:rgba(255,255,255,.45);max-height:120px;overflow:auto;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:11px;}
.row select,.row input{background:#06121c;color:#bfeaff;border:1px solid rgba(0,204,255,.3);border-radius:4px;padding:7px 8px;font-family:inherit;font-size:12px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<script src="../assets/toolsync.js"></script>
</head>
<body>
<a class="back" href="javascript:void(0)" onclick="if(history.length>1){history.back();}else{window.close();}">← RETOUR</a>
<div class="wrap">
<h1>⌁ PIRATAGE</h1>
<div class="sub">PROTOCOLE D'INTRUSION — MOON // ECHO-9</div>
<div id="v"></div>
</div>
<script>
/* ═════ CIBLES ═════ */
var TARGETS=[
 {id:'cam',ico:'📹',n:'Caméra de rue',lv:1,d:'Réseau de surveillance municipal.',dm:[
   {n:'BOUCLE VIDÉO',e:'Les caméras de la zone rejouent 2 minutes d\'images vides.'},
   {n:'REPÉRAGE',e:'Tu obtiens le plan des caméras et angles morts du secteur.'}]},
 {id:'porte',ico:'🚪',n:'Porte blindée / serrure',lv:2,d:'Verrou magnétique d\'un bâtiment.',dm:[
   {n:'OUVERTURE',e:'La porte se déverrouille sans alarme.'},
   {n:'JOURNAL D\'ACCÈS',e:'Tu effaces ton passage des logs de la porte.'},
   {n:'ALARME FANTÔME',e:'Tu peux déclencher une fausse alarme ailleurs dans le bâtiment.'}]},
 {id:'drone',ico:'🚁',n:'Drone de sécurité',lv:3,d:'Drone corpo en patrouille.',dm:[
   {n:'PRISE DE CONTRÔLE',e:'Le drone obéit à tes ordres pendant 3 tours.'},
   {n:'AVEUGLER',e:'Ses capteurs sont brouillés : il ne te voit plus.'},
   {n:'CODE DE PATROUILLE',e:'Tu apprends l\'itinéraire de toutes les patrouilles.'}]},
 {id:'term',ico:'🖥',n:'Terminal Arasaka',lv:4,d:'Poste interne d\'un cadre. Contre-mesures actives.',dm:[
   {n:'DONNÉES CLASSIFIÉES',e:'Tu exfiltres un dossier confidentiel (le MJ te révèle un secret).'},
   {n:'ACCÈS ADMIN',e:'Tu contrôles les portes et lumières de l\'étage.'},
   {n:'EFFACEMENT',e:'Plus aucune trace de ton intrusion.'},
   {n:'VIRUS SENTINELLE',e:'Tu piéges le réseau pour ralentir la riposte de 5 minutes.'}]},
 {id:'serv',ico:'🗄',n:'Serveur central corpo',lv:5,d:'Cœur du réseau. ICE noire possible.',dm:[
   {n:'EXTRACTION MASSIVE',e:'Tu copies la base complète : plans, comptes, personnel.'},
   {n:'CONTRÔLE TOTAL',e:'Tu verrouilles tout le site : plus personne ne sort ni n\'entre.'},
   {n:'FAUX ORDRES',e:'Tu envoies de fausses instructions aux équipes de sécurité.'},
   {n:'SABOTAGE',e:'Les systèmes sont détruits : le site sera hors service des jours.'}]},
 {id:'pnj',ico:'🧠',n:'Cyberware d\'un ennemi',lv:3,d:'Piratage direct des implants d\'un adversaire.',dm:[
   {n:'SURCHARGE',e:'L\'ennemi subit 2d6 dégâts et perd son action.'},
   {n:'PARALYSIE',e:'L\'ennemi est figé 2 tours.'},
   {n:'ESPIONNAGE',e:'Tu vois et entends ce qu\'il perçoit.'}]}
];
var DIFF={1:{size:5,buf:6,time:60},2:{size:5,buf:7,time:55},3:{size:6,buf:7,time:50},4:{size:6,buf:8,time:45},5:{size:7,buf:8,time:40}};
var HEX=['1C','55','BD','E9','7A','FF'];
var q=new URLSearchParams(location.search),ROLE=q.get('role')||'hunter';
var S=null,tm=null,logs=[];
function r(n){return Math.floor(Math.random()*n);}
function view(h){document.getElementById('v').innerHTML=h;}

function home(){
  clearInterval(tm);
  var h='<h2>CHOISIS UNE CIBLE</h2><div class="targets">';
  TARGETS.forEach(function(t,i){h+='<button class="tg" onclick="start('+i+')"><span style="font-size:26px">'+t.ico+'</span><b>'+t.n.toUpperCase()+'</b><small>'+t.d+'</small><span class="lv">SÉCURITÉ '+'■'.repeat(t.lv)+'□'.repeat(5-t.lv)+'</span></button>';});
  h+='</div><h2>RÈGLES</h2><div class="box" style="font-size:11px;line-height:1.8;color:rgba(255,255,255,.65)">Tu disposes d\'un <b style="color:#ffe94a">tampon</b> limité. Choisis des codes dans la matrice : le premier se prend dans la <b>ligne du haut</b>, puis tu alternes <b>colonne</b> / <b>ligne</b>. Chaque <b>démon</b> dont la séquence apparaît dans ton tampon s\'active. Attention aux cases <b style="color:#ff2040">▓▓ ICE</b> : les piocher gaspille un emplacement du tampon et coûte 4 secondes. À partir de la sécurité ■■■, une fois tous les démons activés, une <b>phase de décryptage</b> (mémoire) t\'attend : réussis-la pour obtenir un <b style="color:#00ff88">code d\'accès</b> à transmettre au MJ. Plus la sécurité est haute, plus la matrice est grande et le temps court.</div>';
  var cl=codes();if(cl.length)h+='<h2>CODES D\'ACCÈS OBTENUS</h2><div class="box log" style="color:#00ff88">'+cl.slice(0,6).map(function(x){return x.c+' — '+x.t;}).join('<br>')+'</div>';
  if(logs.length)h+='<h2>JOURNAL D\'INTRUSION</h2><div class="box log">'+logs.slice(-12).reverse().join('<br>')+'</div>';
  view(h);
}

function gen(t){
  var D=DIFF[t.lv],n=D.size,m=[];
  for(var i=0;i<n;i++){m.push([]);for(var j=0;j<n;j++)m[i].push(HEX[r(HEX.length)]);}
  /* chemin solution garanti */
  var path=[],used={},row=0,col=0,ok=true;
  for(var s=0;s<D.buf;s++){
    var cands=[];
    if(s===0){for(var c=0;c<n;c++)cands.push([0,c]);}
    else if(s%2===1){for(var rr=0;rr<n;rr++)cands.push([rr,col]);}
    else{for(var c2=0;c2<n;c2++)cands.push([row,c2]);}
    cands=cands.filter(function(x){return !used[x[0]+','+x[1]];});
    if(!cands.length)break;
    var p=cands[r(cands.length)];row=p[0];col=p[1];used[p[0]+','+p[1]]=1;path.push(p);
  }
  var codes=path.map(function(p){return m[p[0]][p[1]];});
  var onPath={};path.forEach(function(p){onPath[p[0]+','+p[1]]=1;});
  var ice=t.lv+1,guard=0;
  while(ice>0&&guard++<200){var ri=r(n),rj=r(n);if(onPath[ri+','+rj]||m[ri][rj]==='▓▓')continue;m[ri][rj]='▓▓';ice--;}
  var dms=t.dm.map(function(d,k){
    var len=2+Math.min(2,Math.floor(k/2)+r(2)),st=r(Math.max(1,codes.length-len+1));
    return {n:d.n,e:d.e,seq:codes.slice(st,st+len),done:false};
  });
  return {t:t,m:m,n:n,buf:[],pos:[],used:{},row:0,col:0,max:D.buf,dms:dms,time:D.time,left:D.time,over:false,pen:0,decrypted:false};
}
function start(i){
  S=gen(TARGETS[i]);paint();if(window.NPTools)NPTools.event('lance un piratage : '+S.t.n+' (sécurité '+S.t.lv+'/5)');
  var t0=Date.now();clearInterval(tm);
  tm=setInterval(function(){
    S.left=Math.max(0,S.time-S.pen-(Date.now()-t0)/1000);
    var el=document.getElementById('tb');if(el)el.style.width=(S.left/S.time*100)+'%';
    var tx=document.getElementById('tt');if(tx)tx.textContent=Math.ceil(S.left)+'s';
    if(S.left<=0)finish();
  },100);
}
function valid(i,j){
  if(S.used[i+','+j])return false;
  var step=S.buf.length;
  if(step===0)return i===0;
  if(step%2===1)return j===S.col;
  return i===S.row;
}
function pick(i,j){
  if(S.over||!valid(i,j))return;
  S.buf.push(S.m[i][j]);S.used[i+','+j]=1;S.row=i;S.col=j;
  if(S.m[i][j]==='▓▓'){S.pen+=4;S.left=Math.max(0,S.left-4);}
  check();
  if(window.NPTools&&S.buf.length%2===0)NPTools.pub();
  if(S.buf.length>=S.max||S.dms.every(function(d){return d.done;}))finish();else paint();
}
function check(){
  var b=S.buf.join(',');
  S.dms.forEach(function(d){if(!d.done&&(','+b+',').indexOf(','+d.seq.join(',')+',')>=0)d.done=true;});
}
function paint(){
  var h='<div class="hud"><span>CIBLE : '+S.t.ico+' '+S.t.n.toUpperCase()+'</span><div class="timer"><i id="tb" style="width:'+(S.left/S.time*100)+'%"></i></div><span id="tt">'+Math.ceil(S.left)+'s</span></div><div class="game"><div class="box"><h3>MATRICE DE CODES</h3><div class="mx" style="grid-template-columns:repeat('+S.n+',1fr)">';
  for(var i=0;i<S.n;i++)for(var j=0;j<S.n;j++){
    var u=S.used[i+','+j],v=valid(i,j);
    h+='<button class="cell '+(u?'used':v?(S.m[i][j]==='▓▓'?'ok ice':'ok'):'dim')+'" onclick="pick('+i+','+j+')">'+S.m[i][j]+'</button>';
  }
  h+='</div></div><div><div class="box"><h3>TAMPON ('+S.buf.length+'/'+S.max+')</h3><div class="buf">';
  for(var k=0;k<S.max;k++)h+='<div class="slot '+(S.buf[k]?'f':'')+'">'+(S.buf[k]||'')+'</div>';
  h+='</div></div><div class="box" style="margin-top:12px"><h3>DÉMONS À ACTIVER</h3>';
  S.dms.forEach(function(d){
    var b=S.buf.join(',');
    h+='<div class="dm '+(d.done?'done':'')+'"><b>'+d.n+'</b><div class="seq">'+d.seq.map(function(c){return '<span class="'+(d.done?'m':'')+'">'+c+'</span>';}).join('')+'</div><small>'+d.e+'</small></div>';
  });
  h+='</div><div style="margin-top:12px;text-align:center"><button class="btn" onclick="finish()">VALIDER LE TAMPON</button> <button class="btn" style="border-color:#666;color:#999" onclick="home()">ABANDONNER</button></div></div></div>';
  view(h);
}
function hash(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h;}
function mkCode(t){
  var stamp=Math.floor(Date.now()/60000)%46656,st36=('00'+stamp.toString(36)).slice(-3).toUpperCase();
  var sc=(window.NPTools&&NPTools.code&&NPTools.code())||'';
  var chk=('000'+(hash(sc+'|'+t.id+'|'+st36)%46656).toString(36)).slice(-3).toUpperCase();
  return 'MN-'+t.id.slice(0,3).toUpperCase()+'-'+st36+'-'+chk;
}
function saveCode(c,t){try{var l=JSON.parse(localStorage.getItem('np_moon_codes')||'[]');l.unshift({c:c,t:t.n,d:Date.now()});localStorage.setItem('np_moon_codes',JSON.stringify(l.slice(0,20)));}catch(e){}}
function finish(){
  if(S.over)return;S.over=true;clearInterval(tm);
  var all=S.dms.every(function(d){return d.done;});
  if(all&&S.t.lv>=3&&!S.decrypted){decrypt();return;}
  conclude(false);
}
/* phase 2 : décryptage (mémoire) pour les cibles de sécurité >= 3 */
var DC=null;
function decrypt(){
  var L=S.t.lv+2,seq=[];for(var i=0;i<L;i++)seq.push(HEX[r(HEX.length)]);
  DC={seq:seq,idx:0,show:true};
  if(window.NPTools)NPTools.event('phase 2 : décryptage ('+L+' codes) sur '+S.t.n);
  var h='<div class="res"><h2 style="color:#ffe94a">PHASE 2 — DÉCRYPTAGE</h2><div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.55)">MÉMORISE LA SÉQUENCE DE '+L+' CODES</div><div class="buf" id="dcs" style="justify-content:center;margin:18px 0"></div><div id="dcg"></div></div>';
  view(h);
  var el=document.getElementById('dcs'),k=0;
  var iv=setInterval(function(){
    if(k>=seq.length){clearInterval(iv);setTimeout(function(){el.innerHTML='<span style="color:#ffe94a;font-size:12px;letter-spacing:2px">REPRODUIS LA SÉQUENCE</span>';dcGrid();},500);return;}
    el.innerHTML='<div class="slot f" style="width:72px;height:72px;font-size:28px">'+seq[k]+'</div>';k++;
  },900-Math.min(300,S.t.lv*50));
}
function dcGrid(){
  var h='<div class="buf" style="justify-content:center;margin-top:14px">';
  HEX.forEach(function(c){h+='<button class="cell ok" style="width:70px;height:70px;aspect-ratio:auto" onclick="dcPick(\''+c+'\')">'+c+'</button>';});
  h+='</div><div id="dcp" style="margin-top:12px;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.5)">0 / '+DC.seq.length+'</div>';
  document.getElementById('dcg').innerHTML=h;
}
function dcPick(c){
  if(!DC)return;
  if(c!==DC.seq[DC.idx]){DC=null;S.decrypted=false;conclude(true);return;}
  DC.idx++;var p=document.getElementById('dcp');if(p)p.textContent=DC.idx+' / '+DC.seq.length;
  if(DC.idx>=DC.seq.length){DC=null;S.decrypted=true;conclude(false);}
}
function conclude(decFail){
  var ok=S.dms.filter(function(d){return d.done;}),n=ok.length,t=S.dms.length;
  var full=n===t&&(S.t.lv<3||S.decrypted);
  var cls=full?'win':n>0?'part':'lose',title=full?'ACCÈS TOTAL':decFail?'DÉCRYPTAGE ÉCHOUÉ':n>0?'INTRUSION PARTIELLE':'ÉCHEC — ICE ACTIVÉE';
  var code=full?mkCode(S.t):null;if(code)saveCode(code,S.t);
  logs.push(new Date().toLocaleTimeString('fr-FR')+' · '+S.t.n+' · '+n+'/'+t+' démons'+(code?' · code '+code:''));
  if(window.NPTools)NPTools.event('piratage '+S.t.n+' : '+title+' ('+n+'/'+t+')'+(n?' — '+ok.map(function(d){return d.n;}).join(', '):'')+(code?' — CODE : '+code:''));
  var h='<div class="res '+cls+'"><h2>'+title+'</h2><div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.55)">'+n+' / '+t+' DÉMONS ACTIVÉS · TEMPS RESTANT '+Math.ceil(S.left)+'s</div><div class="fx">';
  if(n)ok.forEach(function(d){h+='<div><b style="color:#00ff88">'+d.n+'</b> — '+d.e+'</div>';});
  else h+='<div>Rien ne passe. Le MJ décide de la riposte du réseau (alerte, ICE, retour de flamme).</div>';
  if(n<t&&n>0)h+='<div style="color:#ffaa00">Démons non activés : '+S.dms.filter(function(d){return !d.done;}).map(function(d){return d.n;}).join(', ')+'.</div>';
  if(decFail)h+='<div style="color:#ff6080">Le décryptage a échoué : les effets sont obtenus mais le code d\'accès reste verrouillé.</div>';
  if(n===0)h+='<div style="color:#ff6080">Conseil MJ : dégâts de feedback 1d6 sur le netrunner.</div>';
  h+='</div>';
  if(code)h+='<div style="margin:16px auto;max-width:420px;border:2px solid #00ff88;border-radius:10px;padding:14px;background:rgba(0,255,136,.07)"><div style="font-size:10px;letter-spacing:3px;color:#00ff88">CODE D\'ACCÈS OBTENU — DONNE-LE À UN ALLIÉ (ou au MJ) : il pourra ACTIVER / DÉSACTIVER la cible</div><div style="font-family:Orbitron,monospace;font-size:26px;letter-spacing:4px;color:#fff;margin:8px 0;user-select:all" id="cdv">'+code+'</div><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+code+'\')">COPIER</button></div>';
  h+='<button class="btn" onclick="start('+TARGETS.indexOf(S.t)+')">REJOUER LA CIBLE</button> <button class="btn" onclick="home()">AUTRE CIBLE</button></div>';
  view(h);
}
function codes(){try{return JSON.parse(localStorage.getItem('np_moon_codes')||'[]');}catch(e){return [];}}

home();
