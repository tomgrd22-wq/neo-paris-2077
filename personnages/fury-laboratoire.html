<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FURY — Laboratoire // Neo-Paris 2077</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#040a07;color:#bfe9d3;font-family:'Share Tech Mono',monospace;min-height:100%;}
body{background:radial-gradient(ellipse at 50% -10%,#0a2a1a,#040a07 60%);}
.back{position:fixed;top:10px;left:10px;z-index:60;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.45);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:4px;background:#040a07;}
.wrap{max-width:980px;margin:0 auto;padding:54px 14px 40px;}
h1{font-family:'Orbitron',monospace;font-size:22px;letter-spacing:5px;color:#00ff88;text-align:center;margin:0;text-shadow:0 0 16px rgba(0,255,136,.6);}
.sub{text-align:center;font-size:10px;letter-spacing:3px;color:rgba(0,255,136,.45);margin:4px 0 16px;}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.tabs button,.btn{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;padding:9px 16px;border-radius:6px;border:1px solid #00ff88;color:#00ff88;background:rgba(0,255,136,.07);cursor:pointer;}
.tabs button.on{background:#00ff88;color:#040a07;}
.btn:disabled{opacity:.35;cursor:default;}
.btn.red{border-color:#ff4060;color:#ff4060;background:rgba(255,32,64,.07);}
.lab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;}
@media(max-width:720px){.lab{grid-template-columns:1fr;}}
.box{border:1px solid rgba(0,255,136,.22);border-radius:8px;padding:12px;background:rgba(0,14,8,.7);}
.box h3{margin:0 0 10px;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;color:rgba(0,255,136,.7);}
.ing{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.ig{position:relative;text-align:left;border:1px solid var(--c);background:rgba(255,255,255,.02);color:#dff;border-radius:7px;padding:8px;cursor:pointer;font-family:inherit;}
.ig:hover:not(:disabled){background:rgba(255,255,255,.08);}
.ig:disabled{opacity:.3;cursor:default;}
.ig .i{font-size:22px}.ig b{display:block;font-size:10px;letter-spacing:1px;color:var(--c);margin:2px 0;}
.ig small{font-size:9px;color:rgba(255,255,255,.5);line-height:1.4;display:block;}
.ig .q{position:absolute;top:5px;right:7px;font-size:10px;color:#fff;}
.mixer{display:flex;gap:10px;justify-content:center;margin:6px 0 12px;}
.vial{width:78px;height:98px;border:2px dashed rgba(0,255,136,.35);border-radius:6px 6px 28px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;text-align:center;padding:4px;color:rgba(255,255,255,.4);cursor:pointer;}
.vial.f{border-style:solid;color:#fff;background:rgba(0,255,136,.08);}
.vial span{font-size:26px;display:block;}
.out{text-align:center;min-height:84px;font-size:12px;line-height:1.6;}
.syr{border:1px solid var(--c);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.02);}
.syr .si{font-size:28px;filter:drop-shadow(0 0 8px var(--c));}
.syr b{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:1px;color:var(--c);}
.syr small{display:block;font-size:10px;color:rgba(255,255,255,.6);line-height:1.5;margin-top:2px;}
.syr .act{margin-left:auto;display:flex;flex-direction:column;gap:5px;}
.tag{display:inline-block;font-size:8px;letter-spacing:1px;padding:2px 5px;border-radius:3px;border:1px solid;margin-right:4px;}
.fail{color:#ff6080}
.bubble{animation:bub .9s ease;}
@keyframes bub{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.rec{font-size:11px;line-height:1.7;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.rec b{color:#00ff88}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<script src="../assets/toolsync.js"></script>
</head>
<body>
<a class="back" href="javascript:void(0)" onclick="if(history.length>1){history.back();}else{window.close();}">← RETOUR</a>
<div class="wrap">
<h1>⚗ LABORATOIRE</h1>
<div class="sub">TABLE DE SYNTHÈSE — FURY // CHARCUDOC</div>
<div class="tabs"><button id="t-s" class="on" onclick="tab('s')">TABLE DE SYNTHÈSE</button><button id="t-i" onclick="tab('i')">SERINGUES</button><button id="t-j" onclick="tab('j')">JOURNAL</button></div>
<div id="v"></div>
</div>
<script>
/* propriétés : soin, stim, toxine, sedatif, instable */
var PR={soin:{n:'SOIN',c:'#00ff88',ico:'💚'},stim:{n:'STIMULANT',c:'#ffaa00',ico:'⚡'},tox:{n:'TOXIQUE',c:'#bb44ff',ico:'☠'},sed:{n:'SÉDATIF',c:'#00ccff',ico:'💤'}};
var ING=[
 {id:'adre',ico:'💉',n:'Adrénaline synthé',c:'#ffaa00',p:{stim:3,instable:1},t:'Coup de fouet.'},
 {id:'nano',ico:'🧬',n:'Nanites médicales',c:'#00ff88',p:{soin:3,instable:1},t:'Réparent les tissus.'},
 {id:'sang',ico:'🩸',n:'Plasma de synthèse',c:'#ff4060',p:{soin:2},t:'Base de transfusion.'},
 {id:'neuro',ico:'🐍',n:'Neurotoxine',c:'#bb44ff',p:{tox:3,sed:1,instable:1},t:'Paralyse les nerfs.'},
 {id:'venin',ico:'🕷',n:'Venin de vipère',c:'#bb44ff',p:{tox:2,stim:1},t:'Douloureux, efficace.'},
 {id:'cryo',ico:'🧊',n:'Cryo-gel',c:'#00ccff',p:{sed:2,soin:1},t:'Ralentit tout.'},
 {id:'morph',ico:'😴',n:'Opioïde de rue',c:'#00ccff',p:{sed:3,tox:1},t:'Éteint la douleur.'},
 {id:'stab',ico:'🧪',n:'Stabilisant',c:'#e8e8f4',p:{instable:-2},t:'Rend le mélange sûr.'},
 {id:'eau',ico:'💧',n:'Eau stérile',c:'#8fd0ff',p:{},t:'Dilue : réduit la puissance.',dil:true},
 {id:'psy',ico:'🍄',n:'Psychotrope',c:'#ff33cc',p:{stim:2,sed:1,instable:2},t:'Imprévisible.'},
 {id:'acid',ico:'🧫',n:'Acide corrosif',c:'#aaff00',p:{tox:2,instable:2},t:'Brûle tout ce qu\'il touche.'},
 {id:'anti',ico:'💊',n:'Antibiotique',c:'#e8e8f4',p:{soin:1,instable:-1},t:'Neutralise les infections.'}
];
var STOCK0=0;var BASE_ING=ING.slice();
/* recettes nommées (ids triés) */
var NAMED={
 'adre+nano':{n:'Sérum de Combat',e:'+2 aux actions physiques pendant 1 scène, soigne 1d6.',k:'stim'},
 'cryo+nano':{n:'Gel Cicatrisant',e:'Stoppe les saignements, soigne 2d6 sur 3 tours.',k:'soin'},
 'neuro+venin':{n:'Dard Paralysant',e:'La cible rate son prochain tour (jet de résistance).',k:'tox'},
 'morph+sang':{n:'Antalgique Dosé',e:'Ignore les malus de blessure pendant 1 scène.',k:'sed'},
 'adre+psy':{n:'Cocktail Berserk',e:'+3 en attaque, -3 en défense, impossible de battre en retraite.',k:'stim'},
 'cryo+neuro':{n:'Sommeil Profond',e:'La cible s\'endort pour 1d6 minutes.',k:'sed'},
 'nano+sang+stab':{n:'Transfusion Express',e:'Soigne 3d6 et retire un état négatif.',k:'soin'},
 'acid+venin':{n:'Poison Rongeur',e:'1d6 dégâts par tour pendant 4 tours.',k:'tox'},
 'adre+cryo+stab':{n:'Phase Zéro',e:'Réflexes figés : agit en premier à la prochaine initiative.',k:'stim'}
};
var SIDE=['Tremblements pendant 1 heure.','Vision floue pendant 10 minutes.','Soif insatiable et nausée.','Fièvre légère jusqu\'au repos.','Goût métallique, malus de -1 en Charisme.','Sursauts nerveux : -1 à la discrétion.','Aucun effet secondaire notable.','Aucun effet secondaire notable.'];
var q=new URLSearchParams(location.search),ROLE=q.get('role')||'fury',KS='np_lab_'+ROLE;
var st=load();
if(!st.custom)st.custom={};if(!st.customIng)st.customIng=[];
if(st.v!==2){ING.forEach(function(g){st.stock[g.id]=0;});st.seen={};st.pending=false;st.v=2;save();}
if(!st.seen)st.seen={};if(!st.removed)st.removed=[];
st.removed.forEach(function(id){var g=ING.filter(function(x){return x.id===id;})[0];if(g)ING.splice(ING.indexOf(g),1);});
function setStock(id,q){st.stock[id]=Math.max(0,Math.min(12,q|0));if(st.stock[id]>0)st.seen[id]=1;}
st.customIng.forEach(function(g){if(!ing(g.id)){ING.push(g);}if(st.stock[g.id]==null)st.stock[g.id]=0;});Object.keys(st.custom).forEach(function(k){NAMED[k]=st.custom[k];});
var mix=[],last=null,pageTab='s';
function load(){try{var v=JSON.parse(localStorage.getItem(KS));if(v&&v.stock)return v;}catch(e){}var s={};ING.forEach(function(i){s[i.id]=STOCK0;});return {stock:s,syr:[],known:{},seen:{},removed:[],v:2};}
function save(){try{localStorage.setItem(KS,JSON.stringify(st));}catch(e){}}
function ing(id){return ING.filter(function(i){return i.id===id;})[0];}
function r(n){return Math.floor(Math.random()*n);}
function view(h){document.getElementById('v').innerHTML=h;}
function tab(t){pageTab=t;['s','i','j'].forEach(function(x){document.getElementById('t-'+x).className=x===t?'on':'';});render();}
function add(id){if(mix.length>=3||st.stock[id]<=0)return;mix.push(id);render();}
function rem(i){mix.splice(i,1);render();}
function clearMix(){mix=[];render();}
function analyse(ids){
  var v={soin:0,stim:0,tox:0,sed:0,instable:0},dil=0;
  ids.forEach(function(id){var g=ing(id);if(g.dil)dil++;for(var k in g.p)v[k]+=g.p[k];});
  return {v:v,dil:dil};
}
function synth(){
  if(mix.length<2)return;
  var ids=mix.slice();ids.forEach(function(id){st.stock[id]--;});
  var key=ids.slice().sort().join('+'),a=analyse(ids),v=a.v;
  /* instabilité : jet de risque */
  var risk=Math.max(0,v.instable)*14,roll=r(100);
  var res;
  if(roll<risk){
    var bad=['Le mélange mousse et explose : 1d6 dégâts à Fury.','Réaction exothermique : le labo est enfumé, tout est perdu.','Le flacon se fissure et dégage un gaz toxique : jet d\'Endurance.'];
    res={fail:true,txt:bad[r(bad.length)]};last=res;mix=[];save();render();if(window.NPTools)NPTools.event('ÉCHEC de synthèse ('+ids.map(function(i){return ing(i).n;}).join(' + ')+') : '+res.txt);return;
  }
  var named=NAMED[key],name,eff,kind,pot;
  var sorted=Object.keys(PR).sort(function(x,y){return v[y]-v[x];});
  var top=sorted[0];
  if(a.dil){pot=Math.max(1,Math.round(Math.max(v[top],1)/(1+a.dil)));}else pot=Math.max(1,Math.min(5,v[top]));
  if(named){name=named.n;eff=named.e;kind=named.k;st.known[key]=name;}
  else if(v[top]<=0){name='Mixture inerte';eff='Aucun effet. Dilué, sans intérêt.';kind='sed';pot=0;}
  else{
    kind=top;
    var base={soin:['Sérum','Soigne '+pot+'d6 PV.'],stim:['Stimulant','+'+Math.min(pot,3)+' aux actions pendant '+pot+' tours.'],tox:['Toxine','Inflige '+pot+'d6 dégâts de poison.'],sed:['Sédatif','Endort ou ralentit : -'+Math.min(pot,3)+' à toutes les actions de la cible.']}[top];
    var sec=sorted[1];
    name=base[0]+' '+(['Faible','Léger','Standard','Concentré','Puissant','Pur'][Math.min(pot,5)])+(v[sec]>0&&sec!=='instable'?' / '+PR[sec].n.toLowerCase():'');
    eff=base[1]+(v[sec]>0?' Effet secondaire marqué : '+PR[sec].n.toLowerCase()+'.':'');
  }
  var s={id:Date.now(),n:name,e:eff,k:kind,pot:pot,side:SIDE[r(SIDE.length)],tested:false,mix:ids.map(function(i){return ing(i).n;}).join(' + '),unstable:v.instable>=2,named:!!named};
  st.syr.push(s);last={fail:false,syr:s};mix=[];save();render();if(window.NPTools)NPTools.event('synthétise « '+s.n+' » ('+s.mix+')');
}
function testSyr(id){
  var s=st.syr.filter(function(x){return x.id===id;})[0];if(!s)return;
  s.tested=true;save();render();if(window.NPTools)NPTools.event('teste « '+s.n+' » → '+s.side);
}
function dropSyr(id){var _s=st.syr.filter(function(x){return x.id===id;})[0];if(window.NPTools&&_s)NPTools.event('jette « '+_s.n+' »');st.syr=st.syr.filter(function(x){return x.id!==id;});save();render();}
function useSyr(id){var _s=st.syr.filter(function(x){return x.id===id;})[0];st.syr=st.syr.filter(function(x){return x.id!==id;});save();render();if(window.NPTools&&_s)NPTools.event('UTILISE « '+_s.n+' » — '+_s.e);}
function restock(){st.pending=true;save();render();if(window.NPTools)NPTools.event('demande un réapprovisionnement');}
function syrHTML(s,acts){
  var c=(PR[s.k]||PR.sed).c;
  return '<div class="syr" style="--c:'+c+'"><div class="si">💉</div><div><b>'+s.n.toUpperCase()+'</b><small>'+s.e+'</small><small>Puissance : '+'●'.repeat(s.pot)+'○'.repeat(Math.max(0,5-s.pot))+' · '+(PR[s.k]||PR.sed).n+'</small><small>'+(s.tested?'<span style="color:#ffaa00">Effet secondaire : '+s.side+'</span>':'<span style="color:rgba(255,255,255,.35)">Effets secondaires inconnus (non testée)</span>')+'</small><small style="opacity:.5">'+s.mix+'</small></div>'+(acts?'<div class="act">'+acts+'</div>':'')+'</div>';
}
function render(){
  if(pageTab==='s'){
    var h='<div class="lab"><div class="box"><h3>INGRÉDIENTS</h3><div class="ing">';
    var vis=ING.filter(function(g){return (st.stock[g.id]||0)>0;});
    if(!vis.length)h+='<div class="out" style="grid-column:1/-1;color:rgba(255,255,255,.4)">Ton labo est vide (plus aucun produit).<br>Les produits se trouvent au cours de l\'aventure : le MJ t\'en remettra.</div>';
    vis.forEach(function(g){var q=st.stock[g.id]||0;h+='<button class="ig" style="--c:'+g.c+'" '+(q<=0||mix.length>=3?'disabled':'')+' onclick="add(\''+g.id+'\')"><span class="q">x'+q+'</span><span class="i">'+g.ico+'</span><b>'+g.n.toUpperCase()+'</b><small>'+g.t+'</small></button>';});
    h+='</div><div style="margin-top:10px;font-size:10px;color:rgba(255,255,255,.35)">Les produits trouvés pendant l\'aventure s\'ajoutent ici.</div></div>';
    h+='<div class="box"><h3>TABLE DE MÉLANGE</h3><div class="mixer">';
    for(var i=0;i<3;i++){var id=mix[i],g=id?ing(id):null;h+='<div class="vial '+(g?'f':'')+'" onclick="'+(g?'rem('+i+')':'')+'">'+(g?'<span>'+g.ico+'</span>'+g.n:'+ FIOLE '+(i+1))+'</div>';}
    h+='</div><div style="text-align:center;margin-bottom:12px"><button class="btn" onclick="synth()" '+(mix.length<2?'disabled':'')+'>SYNTHÉTISER</button> <button class="btn red" onclick="clearMix()" '+(mix.length?'':'disabled')+'>VIDER</button></div>';
    if(mix.length>=2){var a=analyse(mix),v=a.v;h+='<div class="out" style="color:rgba(255,255,255,.55);font-size:10px;letter-spacing:1px">ANALYSE : '+Object.keys(PR).map(function(k){return PR[k].ico+' '+Math.max(0,v[k]);}).join(' &nbsp; ')+' &nbsp; ⚠ INSTABILITÉ '+Math.max(0,v.instable)+(v.instable>=3?' (DANGEREUX)':v.instable>=1?' (RISQUÉ)':' (STABLE)')+'</div>';}
    if(last){
      if(last.fail)h+='<div class="out bubble fail"><b>✖ ÉCHEC DE SYNTHÈSE</b><br>'+last.txt+'<br><small>Les ingrédients sont perdus. Le MJ applique les conséquences.</small></div>';
      else h+='<div class="out bubble"><b style="color:#00ff88">✔ NOUVELLE SERINGUE'+(last.syr.named?' — RECETTE CONNUE':'')+'</b></div>'+syrHTML(last.syr);
    }else h+='<div class="out" style="color:rgba(255,255,255,.35)">Choisis 2 ou 3 ingrédients. Le stabilisant réduit le risque ; plus un mélange est instable, plus il peut exploser.</div>';
    view(h+'</div></div>');return;
  }
  if(pageTab==='i'){
    var h2='<div class="box"><h3>MES SERINGUES ('+st.syr.length+')</h3>';
    if(!st.syr.length)h2+='<div class="out" style="color:rgba(255,255,255,.35)">Aucune seringue. Va à la table de synthèse.</div>';
    st.syr.slice().reverse().forEach(function(s){h2+=syrHTML(s,(s.tested?'':'<button class="btn" onclick="testSyr('+s.id+')">TESTER</button>')+'<button class="btn" onclick="useSyr('+s.id+')">UTILISER</button><button class="btn red" onclick="dropSyr('+s.id+')">JETER</button>');});
    view(h2+'<div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:8px">TESTER révèle l\'effet secondaire (sur un cobaye ou sur toi). UTILISER consomme la seringue : annonce-la au MJ.</div></div>');return;
  }
  var h3='<div class="box"><h3>JOURNAL DE RECHERCHE</h3>';
  var keys=Object.keys(NAMED),n=Object.keys(st.known).length;
  h3+='<div style="font-size:11px;margin-bottom:8px">Recettes découvertes : <b style="color:#00ff88">'+n+' / '+keys.length+'</b></div>';
  keys.forEach(function(k){
    var d=!!st.known[k];
    h3+='<div class="rec">'+(d?'<b>'+NAMED[k].n+'</b> — '+k.split('+').map(function(i){return ing(i).n;}).join(' + ')+'<br><span style="color:rgba(255,255,255,.5)">'+NAMED[k].e+'</span>':'<span style="color:rgba(255,255,255,.3)">??? — recette non découverte ('+k.split('+').length+' ingrédients)</span>')+'</div>';
  });
  view(h3+'</div>');
}
function furyState(){return {stock:st.stock,ing:ING.map(function(g){return {id:g.id,n:g.n,ico:g.ico,custom:!!g.custom,p:g.p,seen:!!st.seen[g.id]};}),removed:st.removed.length,syr:st.syr,known:st.known,total:Object.keys(NAMED).length,recipes:Object.keys(NAMED).map(function(k){return {k:k,n:NAMED[k].n,e:NAMED[k].e,known:!!st.known[k],custom:!!st.custom[k]};}),pending:!!st.pending,lastFail:last&&last.fail?last.txt:null,mix:mix.map(function(i){return ing(i).n;})};}
function furyCmd(d){
  if(d.type==='restock'){if(d.ok){ING.forEach(function(i){st.stock[i.id]=Math.min(8,(st.stock[i.id]||0)+2);});st.pending=false;save();render();NPTools.event('réapprovisionnement accordé par le MJ');}else{st.pending=false;save();render();NPTools.event('réapprovisionnement refusé');}}
  if(d.type==='give'){setStock(d.id,(st.stock[d.id]||0)+(d.q||1));save();render();NPTools.event('reçoit '+(d.q||1)+' x '+(ing(d.id)||{n:d.id}).n+' du MJ');}
  if(d.type==='stock'){setStock(d.id,d.q);save();render();NPTools.event('stock '+(ing(d.id)||{n:d.id}).n+' fixé à '+(d.q|0)+' par le MJ');}
  if(d.type==='addSyr'){var sy={id:Date.now()+Math.floor(Math.random()*1000),n:d.n||'Seringue du MJ',e:d.e||'',k:PR[d.k]?d.k:'soin',pot:Math.max(0,Math.min(5,d.pot|0||3)),side:d.side||'Aucun effet secondaire notable.',tested:!!d.tested,mix:'Fournie par le MJ',unstable:false,named:false};st.syr.push(sy);save();render();NPTools.event('reçoit une seringue du MJ : « '+sy.n+' »');}
  if(d.type==='delSyr'){st.syr=st.syr.filter(function(x){return x.id!==d.id;});save();render();NPTools.event('une seringue est retirée par le MJ');}
  if(d.type==='revealSyr'){st.syr.forEach(function(x){if(x.id===d.id)x.tested=true;});save();render();NPTools.event('effet secondaire révélé par le MJ');}
  if(d.type==='recipe'&&d.ids&&d.ids.length>=2){var key=d.ids.slice().sort().join('+');st.custom[key]={n:d.n||'Recette du MJ',e:d.e||'',k:PR[d.k]?d.k:'soin'};NAMED[key]=st.custom[key];save();render();NPTools.event('nouvelle recette ajoutée par le MJ : « '+(d.n||'?')+' »');}
  if(d.type==='delRecipe'&&st.custom[d.key]){delete st.custom[d.key];delete NAMED[d.key];delete st.known[d.key];save();render();NPTools.event('une recette est supprimée par le MJ');}
  if(d.type==='addIng'&&d.n){var gid='x'+Date.now().toString(36),p={};['soin','stim','tox','sed','instable'].forEach(function(k){var v=parseInt(d.p&&d.p[k],10)||0;if(v)p[k]=Math.max(-3,Math.min(5,v));});var g={id:gid,ico:d.ico||'🧪',n:d.n,c:d.c||'#e8e8f4',p:p,t:d.t||'Produit fourni par le MJ.',custom:true};st.customIng.push(g);ING.push(g);setStock(gid,d.q===0?0:(d.q|0||3));save();render();NPTools.event('reçoit un nouveau produit du MJ : '+g.ico+' '+g.n+' x'+st.stock[gid]);}
  if(d.type==='delIng'){var gi=ING.filter(function(g){return g.id===d.id;})[0];if(gi){ING.splice(ING.indexOf(gi),1);if(gi.custom)st.customIng=st.customIng.filter(function(g){return g.id!==d.id;});else if(st.removed.indexOf(gi.id)<0)st.removed.push(gi.id);delete st.stock[d.id];delete st.seen[d.id];mix=mix.filter(function(i){return i!==d.id;});save();render();NPTools.event('le produit « '+gi.n+' » est retiré par le MJ');}}
  if(d.type==='restoreIng'){st.removed=[];BASE_ING.forEach(function(g){if(!ing(g.id)){ING.push(g);st.stock[g.id]=0;}});save();render();NPTools.event('produits par défaut restaurés (stock à 0)');}
  if(d.type==='resetLab'){ING.forEach(function(i){st.stock[i.id]=0;});st.seen={};st.syr=[];st.known={};st.pending=false;save();render();NPTools.event('laboratoire réinitialisé par le MJ');}
  NPTools.pub();
}
if(window.NPTools)NPTools.player({role:ROLE,getState:furyState,onCmd:furyCmd});
render();
</script>
