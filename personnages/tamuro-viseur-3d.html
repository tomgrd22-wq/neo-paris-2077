<style>

<script>
var ZONES={
  head:{n:'Tête',m:4,x:2,hp:.15},torso:{n:'Torse',m:0,x:1,hp:.26},
  armL:{n:'Bras gauche',m:2,x:.7,hp:.06},armR:{n:'Bras droit',m:2,x:.7,hp:.06},
  foreL:{n:'Avant-bras gauche',m:3,x:.7,hp:.05},foreR:{n:'Avant-bras droit',m:3,x:.7,hp:.05},
  handL:{n:'Main gauche',m:5,x:.5,hp:.03},handR:{n:'Main droite',m:5,x:.5,hp:.03},
  thighL:{n:'Cuisse gauche',m:2,x:.7,hp:.07},thighR:{n:'Cuisse droite',m:2,x:.7,hp:.07},
  legL:{n:'Jambe gauche',m:3,x:.7,hp:.06},legR:{n:'Jambe droite',m:3,x:.7,hp:.06},
  fesses:{n:'Fesses',m:1,x:.7,hp:.04},
  groin:{get n(){return 'Appareil génital '+(st.sex==='f'?'♀':'♂');},m:6,x:1.5,hp:.03}};
var EFFG={h:'Aïe… sonné : perd son prochain tour et voix de soprano pour la journée.',f:'Coup bas : plié en deux, perd son prochain tour.'};
var EFF={get groin(){return EFFG[st.sex==='f'?'f':'h'];},fesses:'Fessée magistrale : ne peut plus s\'asseoir, -1 à tout.',head:'Étourdi : -2 à tout au prochain tour.',torso:'Souffle coupé.',
  armL:'Bras gauche hors d\'usage : lâche ce qu\'il tient.',armR:'Bras droit hors d\'usage : lâche son arme.',
  foreL:'Avant-bras gauche brisé : -2 en attaque.',foreR:'Avant-bras droit brisé : -2 en attaque.',
  handL:'Main gauche écrasée : lâche ce qu\'il tient.',handR:'Main droite écrasée : lâche son arme.',
  thighL:'Cuisse gauche touchée : vitesse réduite de moitié.',thighR:'Cuisse droite touchée : vitesse réduite de moitié.',
  legL:'Jambe gauche brisée : ne peut plus courir.',legR:'Jambe droite brisée : ne peut plus courir.'};
var QS=new URLSearchParams(location.search),EMB=QS.get('embed')==='1';
if(EMB)document.documentElement.classList.add('emb');
var SAVEK='tam_state_'+(new URLSearchParams(location.search).get('code')||'');
var st={sex:'h',hp:30,max:30,aim:null,zd:{},tid:null,tname:''};
Object.keys(ZONES).forEach(function(k){st.zd[k]=0;});
if(!EMB)try{var _v=JSON.parse(localStorage.getItem(SAVEK));if(_v&&_v.max){st.sex=_v.sex==='f'?'f':'h';st.hp=_v.hp;st.max=_v.max;Object.keys(ZONES).forEach(function(k){st.zd[k]=(_v.zd&&_v.zd[k])||0;});}}catch(e){}
function emitPatch(){if(EMB&&st.tid)parent.postMessage({np:'sil',type:'patch',id:st.tid,hp:st.hp,max:st.max,zd:st.zd,sex:st.sex},'*');}
function saveSt(){emitPatch();if(EMB)return;try{localStorage.setItem(SAVEK,JSON.stringify({sex:st.sex,hp:st.hp,max:st.max,zd:st.zd}));}catch(e){}}
function r(n){return 1+Math.floor(Math.random()*n);}
function zmax(k){return Math.max(1,Math.round(st.max*ZONES[k].hp));}

/* ───────── 3D ───────── */
var view=document.getElementById('view');
var scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0a0306,6,16);
var cam=new THREE.PerspectiveCamera(45,1,.1,50);
var rend=new THREE.WebGLRenderer({antialias:true,alpha:true});rend.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
view.insertBefore(rend.domElement,view.firstChild);
scene.add(new THREE.AmbientLight(0xffffff,.55));
var pl=new THREE.PointLight(0xff2040,1.3,14);pl.position.set(2,3,3);scene.add(pl);
var pl2=new THREE.PointLight(0x00ccff,.9,14);pl2.position.set(-3,1,-2);scene.add(pl2);
/* sol holographique */
var grid=new THREE.GridHelper(10,20,0x2a9bff,0x0f2a44);grid.position.y=-1.55;scene.add(grid);
var ring=new THREE.Mesh(new THREE.RingGeometry(1.1,1.16,64),new THREE.MeshBasicMaterial({color:0x2a9bff,side:THREE.DoubleSide,transparent:true,opacity:.6}));ring.rotation.x=-Math.PI/2;ring.position.y=-1.54;scene.add(ring);
var body=new THREE.Group();body.position.y=-1.5;scene.add(body);
var fig=new THREE.Group();fig.scale.setScalar(.82);body.add(fig);
var parts={},mats={},hitMeshes=[];
var HOLO=0x2a9bff;
function zmat(k){return mats[k]||(mats[k]=new THREE.MeshStandardMaterial({color:HOLO,emissive:new THREE.Color(HOLO).multiplyScalar(.12),metalness:.1,roughness:.6,transparent:true,opacity:.3,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));}
var wireMat=new THREE.LineBasicMaterial({color:0x9fdcff,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false});
/* maillage holographique : surface translucide + fil de fer */
function add(k,geo,x,y,z,o,parent){
  o=o||{};var m=new THREE.Mesh(geo,zmat(k));
  m.position.set(x,y,z);if(o.s)m.scale.set(o.s[0],o.s[1],o.s[2]);
  m.userData.zone=k;(parent||fig).add(m);hitMeshes.push(m);
  m.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo),wireMat));
  (parts[k]=parts[k]||[]).push(m);return m;
}
function LA(pts){return new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1]);}),18);}
function SP(r){return new THREE.SphereGeometry(r,16,12);}
/* tête, cou */
add('head',SP(.2),0,3.08,0,{s:[.88,1.18,1]});
add('head',LA([[.075,2.66],[.085,2.8],[.08,2.95]]),0,0,0);
/* torse : buste musclé en V, pectoraux, bassin */
add('torso',LA([[.27,1.68],[.29,1.78],[.26,1.98],[.28,2.15],[.33,2.35],[.37,2.52],[.36,2.62],[.2,2.72],[.09,2.78]]),0,0,0,{s:[1.05,1,.62]});
add('torso',SP(.16),-.16,2.45,.14,{s:[1,.7,.55]});
add('torso',SP(.16),.16,2.45,.14,{s:[1,.7,.55]});
add('torso',SP(.27),0,1.7,0,{s:[1.1,.7,.78]});
add('fesses',SP(.2),0,1.62,-.13,{s:[1.35,.95,.75]});
add('groin',SP(.09),0,1.5,.17,{s:[1,1,.8]});
/* bras : pivot à l'épaule, légèrement écartés */
['armL','armR'].forEach(function(k){
  var sx=k==='armL'?-1:1,P=new THREE.Group();P.position.set(sx*.53,2.58,0);P.rotation.z=sx*.14;fig.add(P);
  add(k,SP(.17),0,0,0,{s:[1,.9,1]},P);
  add(k,LA([[.072,-.62],[.082,-.5],[.1,-.32],[.108,-.18],[.1,-.04]]),0,0,0,null,P);
  add(k,SP(.08),0,-.62,0,null,P);
  var fk=k==='armL'?'foreL':'foreR',hk=k==='armL'?'handL':'handR';
  add(fk,LA([[.058,-1.2],[.07,-1.1],[.085,-.9],[.082,-.72],[.07,-.62]]),0,0,0,null,P);
  add(hk,SP(.075),0,-1.32,0,{s:[.75,1.5,.45]},P);
});
/* jambes : pivot à la hanche, cuisse, genou, mollet galbé, pied */
['legL','legR'].forEach(function(k){
  var sx=k==='legL'?-1:1,P=new THREE.Group();P.position.set(sx*.17,1.72,0);P.rotation.z=-sx*.02;fig.add(P);
  var tk=k==='legL'?'thighL':'thighR';
  add(tk,LA([[.092,-.85],[.105,-.75],[.13,-.5],[.16,-.25],[.165,-.05]]),0,0,0,null,P);
  add(tk,SP(.1),0,-.85,0,null,P);
  add(k,LA([[.05,-1.62],[.065,-1.4],[.095,-1.1],[.1,-.95],[.09,-.85]]),0,0,0,null,P);
  add(k,SP(.09),0,-1.66,.1,{s:[1,.7,2.4]},P);
});
/* viseur flottant (réticule 3D) */
var reticle=new THREE.Mesh(new THREE.TorusGeometry(.14,.012,8,32),new THREE.MeshBasicMaterial({color:0xffc83c}));reticle.visible=false;scene.add(reticle);
var ang=.5,pitch=.15,dist=5.4,auto=true,drag=null,moved=false;
function resize(){var w=view.clientWidth,h=view.clientHeight;rend.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
var modelOn=false,hover=null,hv={};
function paintEnemy(){
  for(var k in mats){
    var d=st.zd[k],mx=zmax(k),f=Math.min(1,d/mx);
    if(modelOn){
      mats[k].uniforms.uColor.value.copy(new THREE.Color(HOLO).lerp(new THREE.Color(0xff1030),f));
      mats[k].uniforms.uAlpha.value=f>=1?.25:1;
    }else{
      var c=new THREE.Color(HOLO).lerp(new THREE.Color(0xff1030),f);
      mats[k].color.copy(c);
      mats[k].emissive.copy(c).multiplyScalar(.12);
      mats[k].opacity=f>=1?.1:.3;
    }
  }
}
/* ───────── Modèle 3D personnalisé (assets/tamuro-silhouette.glb) ─────────
   Le maillage est découpé automatiquement en 6 zones de tir selon la position des triangles.
   Si le fichier ne se charge pas, la silhouette holographique reste en secours. */
var fxT=[],scanT0=1e9;
function glowTex(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(160,220,255,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
/* matériau hologramme : lueur sur les bords (fresnel), relief du modèle, balayage lumineux */
function holoMat(map,y0,H){
  return new THREE.ShaderMaterial({
    uniforms:{uColor:{value:new THREE.Color(HOLO)},uAlpha:{value:1},uMap:{value:map},uT:{value:0},uHover:{value:0},uReveal:{value:0},uY0:{value:y0},uH:{value:H}},
    vertexShader:'varying vec3 vN;varying vec3 vV;varying vec2 vUv;varying float vY;uniform float uY0;uniform float uH;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);vY=(position.y-uY0)/uH;gl_Position=projectionMatrix*mv;}',
    fragmentShader:'varying vec3 vN;varying vec3 vV;varying vec2 vUv;varying float vY;uniform vec3 uColor;uniform float uAlpha;uniform sampler2D uMap;uniform float uT;uniform float uReveal;uniform float uHover;void main(){if(vY>uReveal)discard;float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.2);float l=dot(texture2D(uMap,vUv).rgb,vec3(.333));float band=smoothstep(.07,0.,abs(vY-uReveal))*step(uReveal,.995);vec3 c=uColor*(.28+f*1.5+l*.55)+vec3(.55,.85,1.)*band*.9+vec3(.2,.75,1.)*uHover*(.55+f*.8);float a=(.3+f*.75+l*.35+band*.4+uHover*.55)*uAlpha;gl_FragColor=vec4(c,clamp(a,0.,1.));}',
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
}
function holoScene(mdl,geo,sc,cx,cz,y0){
  /* particules sur le corps */
  var pos=geo.attributes.position,N=1500,arr=new Float32Array(N*3);
  for(var i=0;i<N;i++){var v=Math.floor(Math.random()*pos.count);arr[i*3]=(pos.getX(v)-cx)*sc;arr[i*3+1]=(pos.getY(v)-y0)*sc;arr[i*3+2]=(pos.getZ(v)-cz)*sc;}
  var ord=[];for(var i2=0;i2<N;i2++)ord.push(i2);ord.sort(function(p,q){return arr[p*3+1]-arr[q*3+1];});
  var arr2=new Float32Array(N*3);ord.forEach(function(o,i3){arr2[i3*3]=arr[o*3];arr2[i3*3+1]=arr[o*3+1];arr2[i3*3+2]=arr[o*3+2];});arr=arr2;
  var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(arr,3));pg.setDrawRange(0,0);
  var pm=new THREE.PointsMaterial({size:.04,map:glowTex(),color:0xbfe8ff,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending});
  var pts=new THREE.Points(pg,pm);pts.raycast=function(){};mdl.add(pts);
  /* anneaux lumineux autour du personnage */
  var rings=[];
  [0,.85,1.7,2.55].forEach(function(h,i){
    var g=new THREE.RingGeometry(1.05,1.09,64,1,0,5.3),m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x35b6ff,side:THREE.DoubleSide,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
    var g2=new THREE.RingGeometry(1.0,1.2,64,1,0,5.3),m2=new THREE.Mesh(g2,new THREE.MeshBasicMaterial({color:0x1d7dff,side:THREE.DoubleSide,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));
    var gr=new THREE.Group();gr.add(m);gr.add(m2);gr.rotation.x=-Math.PI/2;gr.position.y=h+.02;mdl.add(gr);rings.push(gr);
  });
  /* rayons verticaux */
  var lp=[],lc=[];for(var k=0;k<40;k++){var an=Math.random()*6.283,rr=1.0+Math.random()*.35,x=Math.cos(an)*rr,z=Math.sin(an)*rr,h=2.2+Math.random()*2.2,b=.25+Math.random()*.75;
    lp.push(x,0,z,x,h/2,z,x,h/2,z,x,h,z);lc.push(0,.55*b,b,0,.75*b,1.4*b>1?1:1.4*b,0,.75*b,1,0,0,0);}
  var lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));lg.setAttribute('color',new THREE.Float32BufferAttribute(lc,3));
  var beams=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));beams.raycast=function(){};mdl.add(beams);
  var sring=new THREE.Mesh(new THREE.RingGeometry(.62,.68,64),new THREE.MeshBasicMaterial({color:0x8fe0ff,side:THREE.DoubleSide,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  sring.rotation.x=-Math.PI/2;mdl.add(sring);
  var Hs=geo.boundingBox.max.y-geo.boundingBox.min.y,Hm=Hs*sc;
  window.playScan=function(){scanT0=performance.now()/1000;rings.forEach(function(r){r.visible=true;});beams.visible=true;sring.visible=true;};
  fxT.push(function(t){
    var p=(t-scanT0)/2.8,rv=Math.max(0,Math.min(1,p/.8)),fade=p<.15?p/.15:(p<.85?1:Math.max(0,1-(p-.85)/.35));
    for(var k in mats){mats[k].uniforms.uReveal.value=p>=.8?1:rv;}
    /* particules : apparaissent de bas en haut puis restent discrètes */
    var n=0;while(n<N&&arr[n*3+1]<=rv*Hm)n++;pg.setDrawRange(0,n);
    sring.visible=p<.8;sring.position.y=rv*Hm;sring.material.opacity=.9;
    var on=p<1.2;rings.forEach(function(r){r.visible=on;});beams.visible=on;
    rings.forEach(function(r,i){r.rotation.z=t*(i%2?1.2:-1)+i;r.children[0].material.opacity=.85*fade;r.children[1].material.opacity=.18*fade;});

/* range une pièce (ou un triangle) du modèle dans l'une des 12 zones : cx = décalage latéral, cy = hauteur depuis les pieds */
function partZone(cx,cy,H,cz){
  var ax=Math.abs(cx)/H,h=cy/H,R=cx<0,zz=(cz||0)/H;
  /* pièces dédiées du modèle : appareil génital (devant, au centre) et fesses (derrière, de part et d'autre) */
  if(ax<.03&&h>.38&&h<.62&&zz>.02)return 'groin';
  if(ax>=.02&&ax<.09&&h>.4&&h<.66&&zz<-.02)return 'fesses';            /* côté +x = côté gauche du personnage */

  if(ax<.03)return h>.78?'head':'torso';

}

  if(d.type==='sex'){st.sex=d.v==='f'?'f':'h';saveSt();ui();paintEnemy();NPTools.pub();}
  else if(d.type==='setHp'){if(d.max>0)st.max=Math.round(d.max);if(d.hp!=null)st.hp=Math.max(0,Math.min(st.max,Math.round(d.hp)));saveSt();paintEnemy();ui();NPTools.pub();NPTools.event('PV : '+st.hp+' / '+st.max);}
  else if(d.type==='hit'){var _z=d.z,_d=Math.max(0,Math.round(d.dmg)),_b=(st.zd[_z]||0)+_d>=zmax(_z);playHitFx(_z,_d,_b,function(){applyHit(_z,_d);});}
  else if(d.type==='miss'){var _m=d.z;playMissFx(_m,function(){applyMiss(_m);});}
  else if(d.type==='resetZones'){Object.keys(ZONES).forEach(function(k){st.zd[k]=0;});st.aim=null;saveSt();paintEnemy();ui();NPTools.pub();NPTools.event('zones réinitialisées');}
}
if(window.NPTools&&QS.get('role')!=='mj')NPTools.player({role:(new URLSearchParams(location.search).get('role'))||'tamuro',getState:tamState,onCmd:tamCmd});
window.addEventListener('message',function(e){
  var d=e.data;if(!d||d.np!=='sil')return;
  if(d.type==='show'){resize();return;}
  if(d.type==='fx'){
    if(d.kind==='hit')playHitFx(d.z,d.dmg,d.brk,function(){showHitLog(d.z,d.dmg,d.brk,d.dead);});
    else playMissFx(d.z,function(){applyMiss(d.z);});
    return;
  }
  if(d.type==='aim'){st.aim=d.zone;document.getElementById('aim').innerHTML='ZONE VISÉE : <b>'+(ZONES[d.zone]?ZONES[d.zone].n.toUpperCase():'')+'</b>';paintEnemy();return;}
  if(d.type!=='target')return;
  var changed=st.tid!==d.id;
  st.tid=d.id;st.tname=d.name||'';st.hp=d.hp;st.max=d.max;st.sex=d.sex==='f'?'f':'h';
  Object.keys(ZONES).forEach(function(k){st.zd[k]=(d.zd&&d.zd[k])||0;});
  if(changed){st.aim=null;if(window.playScan)playScan();}
  paintEnemy();ui();zonesMsg();
  if(window.NPTools&&QS.get('role')!=='mj')NPTools.pub();
});
if(EMB)try{parent.postMessage({np:'sil',type:'ready'},'*');}catch(e){}
ui();paintEnemy();loop();loadModel();
</script>
<script defer src="../assets/refresh.js"></script>
</body>
